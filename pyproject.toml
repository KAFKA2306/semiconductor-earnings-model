[project]
name = "semiconductor-earnings-model"
version = "0.1.0"
description = "Reproducible primary financial facts ledger."
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Minimum patched transitive versions; LangGraph 1.2.18 is covered by langgraph-compat CI.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "langgraph-sdk>=0.4.4",
    "urllib3>=2.8.0",
]
