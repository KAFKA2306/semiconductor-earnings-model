[project]
name = "semiconductor-earnings-model"
version = "0.1.0"
description = "Reproducible primary financial facts ledger."
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.4.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# Minimum patched versions for transitives; keep langgraph on the tested 0.4.x API.
constraint-dependencies = [
    "certifi>=2026.10.18",
    "langgraph-sdk>=0.4.4",
    "urllib3>=2.8.0",
]
