name: Audit live semiconductor earnings Pages

on:
  schedule:
    - cron: "55 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the latest successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          github_api() {
            curl --fail --silent --show-error --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$api/$1"
          }

          pages="$(github_api pages)"
          pages_url="$(jq -er '.html_url | select(startswith("https://"))' <<< "$pages")"
          main_sha="$(github_api commits/main | jq -er '.sha | select(test("^[0-9a-f]{40}$"))')"
          deployments="$(github_api 'deployments?environment=github-pages&ref=main&per_page=30' \
            | jq -r 'sort_by(.created_at, .id) | reverse | .[] | [.id, .sha] | @tsv')"

          deployed_sha=""
          while IFS=$'\t' read -r deployment_id candidate_sha; do
            test -n "$deployment_id" || break
            state="$(github_api "deployments/$deployment_id/statuses?per_page=1" | jq -r '.[0].state // "unreported"')"
            if [[ "$state" == success ]]; then
              deployed_sha="$candidate_sha"
              break
            fi
            echo "Pages deployment $deployment_id has status $state"
          done <<< "$deployments"
          if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::No successful GitHub Pages deployment was found for main.'
            exit 1
          fi

          printf 'PAGES_URL=%s\nDEPLOYED_SHA=%s\nMAIN_SHA=%s\n' "${pages_url%/}" "$deployed_sha" "$main_sha" >> "$GITHUB_ENV"
          echo "Expected live build SHA: $deployed_sha (deployment $deployment_id)"
          if [[ "$deployed_sha" != "$main_sha" ]]; then
            echo "::notice::Pages is auditing deployed revision $deployed_sha; main is currently $main_sha."
          fi

      - name: Verify live research workbench, auxiliary research surfaces, and generated APIs
        shell: bash
        run: |
          set -euo pipefail
          base="$PAGES_URL"
          tmp="$(mktemp -d)"

          matched=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 20 "$base/?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/root.html" \
              && curl --fail --silent --show-error --location --max-time 20 "$base/resilience/?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/resilience.html" \
              && curl --fail --silent --show-error --location --max-time 20 "$base/api/v1/ai-infrastructure/index.json?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/ai.json" \
              && curl --fail --silent --show-error --location --max-time 20 "$base/api/v1/semiconductor-resilience/index.json?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/resilience.json" \
              && grep -Fq "data-build-sha=\"${DEPLOYED_SHA}\"" "$tmp/root.html" 2>/dev/null \
              && grep -Fq "data-build-sha=\"${DEPLOYED_SHA}\"" "$tmp/resilience.html" 2>/dev/null \
              && python -m json.tool "$tmp/ai.json" >/dev/null 2>&1 \
              && python -m json.tool "$tmp/resilience.json" >/dev/null 2>&1; then
              matched=true
              break
            fi
            echo "Live Pages does not yet match deployment ${DEPLOYED_SHA} (attempt ${attempt})."
            sleep 5
          done
          if [[ "$matched" != true ]]; then
            echo "::error::Live Pages did not match successful deployment ${DEPLOYED_SHA}."
            exit 1
          fi

          for route in projects model resilience china-ai investment-policy ledger; do
            curl --fail --silent --show-error --location --max-time 20 "$base/$route/?smoke=${GITHUB_SHA}" -o "$tmp/$route.html"
            grep -Fq "data-build-sha=\"${DEPLOYED_SHA}\"" "$tmp/$route.html"
            grep -Fq 'data-workbench' "$tmp/$route.html"
            ! grep -Fq 'pastel-watercolor.css' "$tmp/$route.html"
          done

          for route in projects model resilience; do
            grep -Fq 'RESEARCH WORKBENCH' "$tmp/$route.html"
          done
          curl --fail --silent --show-error --location --max-time 20 "$base/earnings/?smoke=${GITHUB_SHA}" -o "$tmp/earnings.html"
          grep -Fq "data-build-sha=\"${DEPLOYED_SHA}\"" "$tmp/earnings.html"
          grep -Fq 'data-earnings-page' "$tmp/root.html"
          grep -Fq 'data-earnings-page' "$tmp/earnings.html"
          grep -Fq 'data-chart-panel' "$tmp/projects.html"
          grep -Fq 'data-workspace-dialog' "$tmp/projects.html"
          grep -Fq 'data-watchlist-filter' "$tmp/projects.html"
          ! grep -Fq 'pastel-watercolor.css' "$tmp/root.html"

          curl --fail --silent --show-error --location --max-time 20 "$base/api/v1/index.json?smoke=${GITHUB_SHA}" -o "$tmp/index.json"
          curl --fail --silent --show-error --location --max-time 20 "$base/api/v1/semiconductor-profit/index.json?smoke=${GITHUB_SHA}" -o "$tmp/profit.json"
          curl --fail --silent --show-error --location --max-time 20 "$base/api/v1/demand/index.json?smoke=${GITHUB_SHA}" -o "$tmp/demand.json"
          curl --fail --silent --show-error --location --max-time 20 "$base/data/quant-audit.json?smoke=${GITHUB_SHA}" -o "$tmp/audit.json"

          jq -e '.schema_version == "ai-infrastructure-view.v2"' "$tmp/ai.json" >/dev/null
          jq -e '[.observations[] | select(.concept_id == "capital_expenditures" and .source_tier == "primary_regulatory")] | length == 0' "$tmp/ai.json" >/dev/null
          jq -e 'all(.observations[] | select(.sec_concept == "PaymentsToAcquirePropertyPlantAndEquipment"); .concept_id == "cash_paid_for_property_plant_equipment")' "$tmp/ai.json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-06-30:capital-expenditures:actual" and .value == 41000000000)' "$tmp/ai.json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-09-30:capital-expenditures:guidance" and .value == 50000000000 and .qualifier == "greater_than")' "$tmp/ai.json" >/dev/null

          python -m json.tool "$tmp/index.json" >/dev/null
          python -m json.tool "$tmp/profit.json" >/dev/null
          python -m json.tool "$tmp/demand.json" >/dev/null
          python -m json.tool "$tmp/audit.json" >/dev/null

          RESILIENCE="$tmp/resilience.json" AUDIT="$tmp/audit.json" AI="$tmp/ai.json" python - <<'PY'
          import json
          import os

          resilience = json.load(open(os.environ["RESILIENCE"], encoding="utf-8"))
          audit = json.load(open(os.environ["AUDIT"], encoding="utf-8"))
          ai = json.load(open(os.environ["AI"], encoding="utf-8"))
          assert resilience["schema_version"] == "semiconductor-resilience-api.v1"
          assert ai["schema_version"] == "ai-infrastructure-view.v2"
          companies = [company for company in resilience["companies"] if company["years"]]
          assert len(companies) >= 10, len(companies)
          assert all(1 <= len(company["years"]) <= 5 for company in companies)
          assert all(len(company["scenarios"]) == 3 for company in companies)
          assert all(company["years"][0]["operating_cash_flow"]["source_url"].startswith("https://www.sec.gov/") for company in companies)
          assert audit["snapshot_hash"]
          assert audit["audit"]["findings"] is not None

          print(f"SUMMARY generated_at={resilience['generated_at']} companies={len(companies)} hash={resilience['content_hash']}")
          for company in companies:
              annual = company["years"][0]
              severe = next(row for row in company["scenarios"] if row["scenario_id"] == "severe")
              print(
                  f"SEVERE {company['ticker']} period={annual['period_end']} "
                  f"liquid={annual['liquid_reserve']['reported_value']} stressed_fcf={severe['stressed_free_cash_flow_usd']} "
                  f"runway={severe['liquid_reserve_runway_years']} band={severe['runway_band']}"
              )
          print(json.dumps({
              "live_build_sha": os.environ["DEPLOYED_SHA"],
              "main_sha": os.environ["MAIN_SHA"],
              "ai_infrastructure_observations": len(ai["observations"]),
              "resilience_content_hash": resilience["content_hash"],
              "companies_with_data": len(companies),
          }, ensure_ascii=False, indent=2))
          PY

          echo "Live Pages research workbench audit passed: $base/"
