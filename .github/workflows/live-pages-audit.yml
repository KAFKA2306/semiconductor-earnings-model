name: Audit live semiconductor earnings Pages

on:
  pull_request:
    paths:
      - ".github/workflows/live-pages-audit.yml"
  schedule:
    - cron: "55 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recurring production audit contract
        run: |
          set -euo pipefail
          grep -Fq 'cron: "55 2 * * *"' .github/workflows/live-pages-audit.yml
          grep -Fq 'ai-infrastructure-view.v2' .github/workflows/live-pages-audit.yml
          grep -Fq 'cash_paid_for_property_plant_equipment' .github/workflows/live-pages-audit.yml
          grep -Fq 'microsoft:2026-06-30:capital-expenditures:actual' .github/workflows/live-pages-audit.yml
          grep -Fq 'microsoft:2026-09-30:capital-expenditures:guidance' .github/workflows/live-pages-audit.yml

  live-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active Pages configuration and main provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | tee pages-config.json \
            | jq '{html_url, status, build_type, source, public}'
          main_sha="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -er '.sha')"
          echo "MAIN_SHA=${main_sha}" | tee -a "$GITHUB_ENV"
          echo "Expected live build SHA: ${main_sha}"

      - name: Print live severe-scenario financial summary
        run: |
          curl --fail --silent --show-error --location "https://kafka2306.github.io/semiconductor-earnings-model/api/v1/semiconductor-resilience/index.json?summary=${GITHUB_SHA}" -o resilience.json
          python -c 'import json; d=json.load(open("resilience.json")); cs=[c for c in d["companies"] if c["years"]]; print(f"SUMMARY generated_at={d[chr(103)+chr(101)+chr(110)+chr(101)+chr(114)+chr(97)+chr(116)+chr(101)+chr(100)+chr(95)+chr(97)+chr(116)]} companies={len(cs)} hash={d[chr(99)+chr(111)+chr(110)+chr(116)+chr(101)+chr(110)+chr(116)+chr(95)+chr(104)+chr(97)+chr(115)+chr(104)]}"); [(lambda r,y: print(f"SEVERE {c[chr(116)+chr(105)+chr(99)+chr(107)+chr(101)+chr(114)]} period={y[chr(112)+chr(101)+chr(114)+chr(105)+chr(111)+chr(100)+chr(95)+chr(101)+chr(110)+chr(100)]} liquid={y[chr(108)+chr(105)+chr(113)+chr(117)+chr(105)+chr(100)+chr(95)+chr(114)+chr(101)+chr(115)+chr(101)+chr(114)+chr(118)+chr(101)][chr(114)+chr(101)+chr(112)+chr(111)+chr(114)+chr(116)+chr(101)+chr(100)+chr(95)+chr(118)+chr(97)+chr(108)+chr(117)+chr(101)]} stressed_fcf={r[chr(115)+chr(116)+chr(114)+chr(101)+chr(115)+chr(115)+chr(101)+chr(100)+chr(95)+chr(102)+chr(114)+chr(101)+chr(101)+chr(95)+chr(99)+chr(97)+chr(115)+chr(104)+chr(95)+chr(102)+chr(108)+chr(111)+chr(119)+chr(95)+chr(117)+chr(115)+chr(100)]} runway={r[chr(108)+chr(105)+chr(113)+chr(117)+chr(105)+chr(100)+chr(95)+chr(114)+chr(101)+chr(115)+chr(101)+chr(114)+chr(118)+chr(101)+chr(95)+chr(114)+chr(117)+chr(110)+chr(119)+chr(97)+chr(121)+chr(95)+chr(121)+chr(101)+chr(97)+chr(114)+chr(115)]} band={r[chr(114)+chr(117)+chr(110)+chr(119)+chr(97)+chr(121)+chr(95)+chr(98)+chr(97)+chr(110)+chr(100)]}"))(next(x for x in c["scenarios"] if x["scenario_id"]=="severe"), c["years"][0]) for c in cs]'

      - name: Verify live research workbench, auxiliary research surfaces, and generated APIs
        shell: bash
        run: |
          set -euo pipefail
          base="https://kafka2306.github.io/semiconductor-earnings-model"
          tmp="$(mktemp -d)"

          matched=false
          for attempt in $(seq 1 42); do
            curl --fail --silent --show-error --location "$base/?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/root.html" || true
            curl --fail --silent --show-error --location "$base/resilience/?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/resilience.html" || true
            curl --fail --silent --show-error --location "$base/api/v1/ai-infrastructure/index.json?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/ai.json" || true
            curl --fail --silent --show-error --location "$base/api/v1/semiconductor-resilience/index.json?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp/resilience.json" || true
            if grep -Fq "data-build-sha=\"${MAIN_SHA}\"" "$tmp/root.html" 2>/dev/null \
              && grep -Fq "data-build-sha=\"${MAIN_SHA}\"" "$tmp/resilience.html" 2>/dev/null \
              && python -m json.tool "$tmp/ai.json" >/dev/null 2>&1 \
              && python -m json.tool "$tmp/resilience.json" >/dev/null 2>&1; then
              matched=true
              break
            fi
            echo "Live build has not propagated to ${MAIN_SHA} (attempt ${attempt})."
            sleep 10
          done
          test "$matched" = true

          for route in earnings model resilience china-ai investment-policy ledger; do
            curl --fail --silent --show-error --location "$base/$route/?smoke=${GITHUB_SHA}" -o "$tmp/$route.html"
            grep -Fq 'data-workbench' "$tmp/$route.html"
            ! grep -Fq 'pastel-watercolor.css' "$tmp/$route.html"
          done

          for route in earnings model resilience; do
            grep -Fq 'RESEARCH WORKBENCH' "$tmp/$route.html"
          done
          grep -Fq 'data-chart-panel' "$tmp/root.html"
          grep -Fq 'data-workspace-dialog' "$tmp/root.html"
          grep -Fq 'data-watchlist-filter' "$tmp/root.html"
          ! grep -Fq 'pastel-watercolor.css' "$tmp/root.html"

          curl --fail --silent --show-error --location "$base/api/v1/index.json?smoke=${GITHUB_SHA}" -o "$tmp/index.json"
          curl --fail --silent --show-error --location "$base/api/v1/semiconductor-profit/index.json?smoke=${GITHUB_SHA}" -o "$tmp/profit.json"
          curl --fail --silent --show-error --location "$base/api/v1/demand/index.json?smoke=${GITHUB_SHA}" -o "$tmp/demand.json"
          curl --fail --silent --show-error --location "$base/data/quant-audit.json?smoke=${GITHUB_SHA}" -o "$tmp/audit.json"

          jq -e '.schema_version == "ai-infrastructure-view.v2"' "$tmp/ai.json" >/dev/null
          jq -e '[.observations[] | select(.concept_id == "capital_expenditures" and .source_tier == "primary_regulatory")] | length == 0' "$tmp/ai.json" >/dev/null
          jq -e 'all(.observations[] | select(.sec_concept == "PaymentsToAcquirePropertyPlantAndEquipment"); .concept_id == "cash_paid_for_property_plant_equipment")' "$tmp/ai.json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-06-30:capital-expenditures:actual" and .value == 41000000000)' "$tmp/ai.json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-09-30:capital-expenditures:guidance" and .value == 50000000000 and .qualifier == "greater_than")' "$tmp/ai.json" >/dev/null

          python -m json.tool "$tmp/index.json" >/dev/null
          python -m json.tool "$tmp/profit.json" >/dev/null
          python -m json.tool "$tmp/demand.json" >/dev/null
          python -m json.tool "$tmp/audit.json" >/dev/null

          RESILIENCE="$tmp/resilience.json" AUDIT="$tmp/audit.json" AI="$tmp/ai.json" python - <<'PY'
          import json
          import os

          resilience = json.load(open(os.environ["RESILIENCE"], encoding="utf-8"))
          audit = json.load(open(os.environ["AUDIT"], encoding="utf-8"))
          ai = json.load(open(os.environ["AI"], encoding="utf-8"))
          assert resilience["schema_version"] == "semiconductor-resilience-api.v1"
          assert ai["schema_version"] == "ai-infrastructure-view.v2"
          companies = [company for company in resilience["companies"] if company["years"]]
          assert len(companies) >= 10, len(companies)
          assert all(1 <= len(company["years"]) <= 5 for company in companies)
          assert all(len(company["scenarios"]) == 3 for company in companies)
          assert all(company["years"][0]["operating_cash_flow"]["source_url"].startswith("https://www.sec.gov/") for company in companies)
          assert audit["snapshot_hash"]
          assert audit["audit"]["findings"] is not None
          print(json.dumps({
              "live_build_sha": os.environ["MAIN_SHA"],
              "ai_infrastructure_observations": len(ai["observations"]),
              "resilience_content_hash": resilience["content_hash"],
              "companies_with_data": len(companies),
          }, ensure_ascii=False, indent=2))
          PY

          echo "Live Pages research workbench audit passed: $base/"
