name: Earnings daily report

on:
  workflow_dispatch:
  schedule:
    - cron: "7 7 * * *"
      timezone: "Asia/Tokyo"
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-daily-report.yml"
      - "scripts/build_daily_earnings_report.py"
      - "tests/test_daily_earnings_report.py"
  pull_request:
    paths:
      - ".github/workflows/earnings-daily-report.yml"
      - "scripts/build_daily_earnings_report.py"
      - "tests/test_daily_earnings_report.py"
      - ".github/workflows/earnings-ledger-update.yml"

permissions:
  contents: write

concurrency:
  group: earnings-daily-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run daily report regression tests
        run: python -m pytest -q tests/test_daily_earnings_report.py

      - name: Build report from persisted ledger only
        run: python scripts/build_daily_earnings_report.py

      - name: Persist scheduled daily report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/reports)" ]; then
            echo "No daily report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger/reports
          git commit -m "data: update daily earnings report"
          git push
