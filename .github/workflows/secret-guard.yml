name: Secret Guard

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Reject credential-shaped literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Scan tracked text files
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "OpenAI": re.compile(r"sk-(?:proj-)?[A-Za-z0-9_-]{20,}"),
              "Anthropic": re.compile(r"sk-ant-[A-Za-z0-9_-]{20,}"),
              "GitHub": re.compile(r"(?:github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,})"),
              "AWS": re.compile(r"AKIA[0-9A-Z]{16}"),
              "Google API": re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              "Google OAuth secret": re.compile(r"GOCSPX-[0-9A-Za-z_-]{20,}"),
              "Hugging Face": re.compile(r"hf_[A-Za-z0-9]{20,}"),
              "Slack": re.compile(r"xox[baprs]-[0-9A-Za-z-]{20,}"),
              "Stripe": re.compile(r"(?:sk|rk)_live_[0-9A-Za-z]{16,}"),
              "Private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "Supabase service role": re.compile(r"SUPABASE_SERVICE_ROLE_KEY\s*=\s*[\"']?eyJ[A-Za-z0-9._-]{40,}"),
          }
          polymarket = re.compile(
              r"^Polymarket_(?:apiKey|secret|passphrase)\s*=\s*(?!your_|example|placeholder|$).+",
              re.IGNORECASE,
          )

          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings = []
          for name in files:
              if not name:
                  continue
              p = pathlib.Path(name)
              try:
                  if p.stat().st_size > 2_000_000:
                      continue
                  raw = p.read_bytes()
                  if b"\x00" in raw:
                      continue
                  text = raw.decode("utf-8", errors="ignore")
              except OSError:
                  continue

              for lineno, line in enumerate(text.splitlines(), 1):
                  for label, rx in patterns.items():
                      if rx.search(line):
                          findings.append((name, lineno, label))
                  if p.name in {".env.example", ".env.sample"} and polymarket.search(line):
                      findings.append((name, lineno, "Polymarket credential"))

          if findings:
              print("Credential-shaped literals found. Values are intentionally not printed.")
              for name, line, label in findings:
                  print(f"{name}:{line}: {label}")
              sys.exit(1)

          print("Secret Guard: no credential-shaped literals found.")
