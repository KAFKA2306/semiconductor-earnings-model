name: LangGraph compatibility

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/quant_audit_graph.py"
      - "scripts/run_quant_audit.py"
      - "tests/test_quant_audit_graph.py"
      - ".github/workflows/langgraph-compat.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/quant_audit_graph.py"
      - "scripts/run_quant_audit.py"
      - "tests/test_quant_audit_graph.py"
      - ".github/workflows/langgraph-compat.yml"

permissions:
  contents: read

jobs:
  audit-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.8.22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test LangGraph audit contract
        run: uv run python -m pytest -q tests/test_quant_audit_graph.py
      - name: Exercise production audit entrypoint
        run: uv run python scripts/run_quant_audit.py data/quant_audit/semiconductor_latest.json --output /tmp/quant-audit.json
