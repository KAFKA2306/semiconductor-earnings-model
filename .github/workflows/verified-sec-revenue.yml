name: Verified SEC revenue extraction

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/verified-sec-revenue.yml"
      - "scripts/extract_verified_sec_revenue.py"
      - "tests/test_verified_sec_revenue.py"
  pull_request:
    paths:
      - ".github/workflows/verified-sec-revenue.yml"
      - "scripts/extract_verified_sec_revenue.py"
      - "tests/test_verified_sec_revenue.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'earnings-ledger-main-writers' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  extract-verified-revenue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run regression tests
        run: python -m pytest -q tests/test_verified_sec_revenue.py tests/test_earnings_evidence_audit.py tests/test_verified_revenue_lineage.py

      - name: Extract verified SEC XBRL revenue with retry
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set -u
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo "Repository variable SEC_USER_AGENT is required."
            exit 1
          fi
          ok=0
          for attempt in 1 2 3; do
            echo "Company Facts extraction attempt ${attempt}/3"
            if python scripts/extract_verified_sec_revenue.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "verified SEC revenue extraction failed after 3 attempts"
            exit 1
          fi

      # A GITHUB_TOKEN push does not trigger the downstream push workflows.
      # Audit and persist all three coupled artifacts in the same verified run.
      - name: Refresh primary evidence for extracted metrics
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/audit_earnings_evidence.py

      - name: Audit extracted revenue lineage
        run: python scripts/audit_verified_revenue_lineage.py

      - name: Commit verified revenue, evidence and lineage atomically
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          paths=(
            data/earnings_ledger/verified_revenue_latest.json
            data/earnings_ledger/evidence_latest.json
            data/earnings_ledger/verified_revenue_lineage_audit_latest.json
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "Verified revenue, evidence and lineage are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "data: update verified SEC revenue and lineage together"
          # If another writer changes any ledger input, refuse to publish a stale audit.
          export PUSH_GUARD_PATHS="data/earnings_ledger scripts/extract_verified_sec_revenue.py scripts/audit_earnings_evidence.py scripts/audit_verified_revenue_lineage.py"
          bash scripts/push_earnings_commit_with_retry.sh
