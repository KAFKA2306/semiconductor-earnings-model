name: Earnings cross-ledger identity

on:
  pull_request:
    paths:
      - 'scripts/audit_earnings_cross_ledger_identity.py'
      - 'tests/test_earnings_cross_ledger_identity.py'
      - '.github/workflows/earnings-cross-ledger-identity.yml'
      - 'data/earnings_ledger/events.ndjson'
      - 'data/earnings_ledger/rejected.ndjson'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_earnings_cross_ledger_identity.py'
      - 'tests/test_earnings_cross_ledger_identity.py'
      - '.github/workflows/earnings-cross-ledger-identity.yml'
      - 'data/earnings_ledger/events.ndjson'
      - 'data/earnings_ledger/rejected.ndjson'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_earnings_cross_ledger_identity.py
      - name: Audit accepted/rejected identity exclusivity
        run: python scripts/audit_earnings_cross_ledger_identity.py
      - name: Persist audit on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/cross_ledger_identity_audit_latest.json)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/earnings_ledger/cross_ledger_identity_audit_latest.json
          git commit -m 'data: update cross-ledger identity audit'
          git push
