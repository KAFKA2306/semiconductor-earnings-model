name: Earnings cross-ledger identity

on:
  pull_request:
    paths:
      - 'scripts/audit_earnings_cross_ledger_identity.py'
      - 'tests/test_earnings_cross_ledger_identity.py'
      - '.github/workflows/earnings-cross-ledger-identity.yml'
      - 'data/earnings_ledger/events.ndjson'
      - 'data/earnings_ledger/rejected.ndjson'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_earnings_cross_ledger_identity.py'
      - 'tests/test_earnings_cross_ledger_identity.py'
      - '.github/workflows/earnings-cross-ledger-identity.yml'
      - 'data/earnings_ledger/events.ndjson'
      - 'data/earnings_ledger/rejected.ndjson'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'earnings-ledger-main-writers' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run regression tests
        run: python -m pytest -q tests/test_earnings_cross_ledger_identity.py
      - name: Audit accepted/rejected identity exclusivity
        run: python scripts/audit_earnings_cross_ledger_identity.py
      - name: Persist audit on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/cross_ledger_identity_audit_latest.json)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/earnings_ledger/cross_ledger_identity_audit_latest.json
          git commit -m 'data: update cross-ledger identity audit'
          PUSH_GUARD_PATHS="data/earnings_ledger/events.ndjson data/earnings_ledger/rejected.ndjson scripts/audit_earnings_cross_ledger_identity.py" bash scripts/push_earnings_commit_with_retry.sh
