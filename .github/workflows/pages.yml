name: Publish earnings model

on:
  pull_request:
    paths:
      - "data/financial_db/ai_infrastructure_observations.json"
      - "scripts/collect_ai_infrastructure_sec.py"
      - "scripts/build_ai_infrastructure_view.py"
      - "site/**"
      - "tests/test_ai_infrastructure_observations.py"
      - "README.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
      - ".github/workflows/nand-kpi-update.yml"
  schedule:
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic Python environment
        run: uv sync --frozen
      - name: Verify README exposes the live GitHub Pages URL
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/check_readme_pages_link.py
      - name: Fetch primary SEC facts and build static API
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_primary_api.py
      - name: Fetch direct semiconductor profit facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_semiconductor_profit_api.py
      - name: Build semiconductor downside resilience ledger
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_semiconductor_resilience_api_v2.py
      - name: Build ontology-backed semiconductor research API
        run: |
          uv run python scripts/build_semiconductor_research_api.py
          uv run python scripts/finalize_semiconductor_research_api.py
      - name: Fetch normalized demand-side facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_demand_api.py
      - name: Build Financial Database v3 with NAND operating KPIs
        run: uv run python scripts/build_financial_database_with_nand.py
      - name: Build same-period model snapshot
        run: uv run python scripts/build_model_snapshot.py
      - name: Build live AI infrastructure canonical view
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          test -n "${SEC_USER_AGENT:-}"
          uv run python scripts/collect_ai_infrastructure_sec.py
          uv run python scripts/build_ai_infrastructure_view.py
          rm -rf site/public/api/v1/ai-infrastructure
          mkdir -p site/public/api/v1
          cp -R api/v1/ai-infrastructure site/public/api/v1/ai-infrastructure
          uv run python - <<'PY'
          import json
          from pathlib import Path
          view=json.loads(Path('api/v1/ai-infrastructure/index.json').read_text())
          assert view['schema_version'] == 'ai-infrastructure-view.v2'
          rows=view['observations']
          assert not [r for r in rows if r.get('concept_id') == 'capital_expenditures' and r.get('source_tier') == 'primary_regulatory']
          cash=[r for r in rows if r.get('sec_concept') == 'PaymentsToAcquirePropertyPlantAndEquipment']
          assert cash and all(r['concept_id'] == 'cash_paid_for_property_plant_equipment' for r in cash)
          q4=next(r for r in rows if r['id'] == 'microsoft:2026-06-30:capital-expenditures:actual')
          q1=next(r for r in rows if r['id'] == 'microsoft:2026-09-30:capital-expenditures:guidance')
          assert q4['value'] == 41_000_000_000 and q4['value_type'] == 'actual'
          assert q1['value'] == 50_000_000_000 and q1['qualifier'] == 'greater_than' and q1['value_type'] == 'company_guidance'
          PY
      - name: Run generated data contract tests
        run: uv run python -m pytest -q
      - name: Recalculate LangGraph audit
        run: uv run python scripts/run_quant_audit.py data/quant_audit/semiconductor_latest.json --output site/public/data/quant-audit.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build Astro site
        working-directory: site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages, daily AI infrastructure, research database, NAND extension, and provenance
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/earnings/")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/model/")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/resilience/")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v1/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v1/ai-infrastructure/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v1/semiconductor-profit/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v1/semiconductor-resilience/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v1/demand/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v2/semiconductor-research/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v3/financial-database/index.json")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/v3/financial-database/financial.db")" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' "$base/data/quant-audit.json")" = "200"

          root_html="$(curl -fsSL "$base/")"
          earnings_html="$(curl -fsSL "$base/earnings/")"
          model_html="$(curl -fsSL "$base/model/")"
          resilience_html="$(curl -fsSL "$base/resilience/")"
          ai_json="$(curl -fsSL "$base/api/v1/ai-infrastructure/index.json")"
          resilience_json="$(curl -fsSL "$base/api/v1/semiconductor-resilience/index.json")"
          research_json="$(curl -fsSL "$base/api/v2/semiconductor-research/index.json")"
          financial_json="$(curl -fsSL "$base/api/v3/financial-database/index.json")"
          resilience_hash="$(jq -er '.content_hash' <<< "$resilience_json")"
          research_hash="$(jq -er '.content_hash' <<< "$research_json")"

          grep -Fq "AIインフラで、" <<< "$root_html"
          grep -Fq "actual ≠ guidance" <<< "$(tr '[:upper:]' '[:lower:]' <<< "$root_html")"
          grep -Fq "data-build-sha=\"$EXPECTED_BUILD_SHA\"" <<< "$root_html"
          jq -e '.schema_version == "ai-infrastructure-view.v2"' <<< "$ai_json" >/dev/null
          jq -e '[.observations[] | select(.concept_id == "capital_expenditures" and .source_tier == "primary_regulatory")] | length == 0' <<< "$ai_json" >/dev/null
          jq -e 'all(.observations[] | select(.sec_concept == "PaymentsToAcquirePropertyPlantAndEquipment"); .concept_id == "cash_paid_for_property_plant_equipment")' <<< "$ai_json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-06-30:capital-expenditures:actual" and .value == 41000000000 and .value_type == "actual")' <<< "$ai_json" >/dev/null
          jq -e 'any(.observations[]; .id == "microsoft:2026-09-30:capital-expenditures:guidance" and .value == 50000000000 and .qualifier == "greater_than" and .value_type == "company_guidance")' <<< "$ai_json" >/dev/null

          grep -Fq "高い半導体利益成長は、" <<< "$earnings_html"
          grep -Fq "data-build-sha=\"$EXPECTED_BUILD_SHA\"" <<< "$earnings_html"
          grep -Fq "入力 → 式 → 中間値 → 判定" <<< "$model_html"
          grep -Fq "半導体企業は、" <<< "$resilience_html"
          grep -Fq "成長しながら下振れに耐えられるか。" <<< "$resilience_html"
          grep -Fq "利益剰余金は現金ではない" <<< "$resilience_html"
          grep -Fq "RESEARCH WORKBENCH" <<< "$resilience_html"
          grep -Fq "data-build-sha=\"$EXPECTED_BUILD_SHA\"" <<< "$resilience_html"
          grep -Fq "data-resilience-api-hash=\"$resilience_hash\"" <<< "$resilience_html"
          grep -Fq "data-research-api-hash=\"$research_hash\"" <<< "$resilience_html"
          for marker in quality actuals peers scenario ranking history ontology benchmark limits; do
            grep -Fq "id=\"$marker\"" <<< "$resilience_html"
          done

          jq -e '.schema_version == "semiconductor-resilience-api.v1"' <<< "$resilience_json" >/dev/null
          jq -e '[.companies[] | select(.years | length > 0)] | length >= 12' <<< "$resilience_json" >/dev/null
          jq -e 'all(.companies[] | select(.years | length > 0); .years[0].period_end >= "2024-01-01")' <<< "$resilience_json" >/dev/null
          jq -e '.schema_version == "semiconductor-research-workbench.v2"' <<< "$research_json" >/dev/null
          jq -e '.summary.company_count >= 12' <<< "$research_json" >/dev/null
          jq -e '.summary.reported_fact_count >= 250' <<< "$research_json" >/dev/null
          jq -e '.summary.derived_metric_count >= 180' <<< "$research_json" >/dev/null
          jq -e '.summary.evaluation_count >= 72' <<< "$research_json" >/dev/null
          jq -e '.summary.evidence_edge_count >= 100' <<< "$research_json" >/dev/null
          jq -e '.summary.benchmark_platform_count >= 12' <<< "$research_json" >/dev/null
          jq -e 'all(.companies[]; (.evaluations | length) == 6 and (.peer_context | length) >= 10 and .latest_annual_period >= "2024-01-01")' <<< "$research_json" >/dev/null
          jq -e 'all(.companies[] | select(.metrics.severe_runway_band == "self_funding"); any(.evaluations[]; .rule_id == "minimum_two_year_runway" and .result == "pass"))' <<< "$research_json" >/dev/null
          jq -e '(.database.entities | length) == .summary.company_count' <<< "$research_json" >/dev/null
          jq -e 'all(.database.reported_facts[]; .source_url | startswith("https://www.sec.gov/"))' <<< "$research_json" >/dev/null
          jq -e '[.database.evidence_edges[].relationship] | index("derived_from") and index("uses_metric")' <<< "$research_json" >/dev/null

          jq -e '.schema_version == "financial-database.v3"' <<< "$financial_json" >/dev/null
          jq -e '.extensions | index("nand-operating-kpis.v1")' <<< "$financial_json" >/dev/null
          jq -e '.audit.status == "PASS"' <<< "$financial_json" >/dev/null
          jq -e '.audit.counts.entities == (.entities | length)' <<< "$financial_json" >/dev/null
          jq -e '.audit.counts.observations == (.observations | length)' <<< "$financial_json" >/dev/null
          jq -e '.audit.counts.actual_observations > 0' <<< "$financial_json" >/dev/null
          jq -e '.audit.counts.nand_actual_observations >= 8' <<< "$financial_json" >/dev/null
          jq -e '.audit.counts.nand_derived_observations >= 2' <<< "$financial_json" >/dev/null
          jq -e '(.views.nand_kpi_comparisons | length) >= 4' <<< "$financial_json" >/dev/null
          jq -e 'all(.observations[]; (.source_url | startswith("https://")) and (.value_type | IN("actual","company_guidance","analyst_consensus","internal_estimate","scenario","market_observation")))' <<< "$financial_json" >/dev/null
          jq -e '[.observations[].id] | length == (unique | length)' <<< "$financial_json" >/dev/null

          printf '%s' "$resilience_html" | python3 -c 'import sys; html=sys.stdin.read(); markers=["id=\"definition\"", "id=\"quality\"", "id=\"actuals\"", "id=\"peers\"", "id=\"scenario\"", "id=\"ranking\"", "id=\"history\"", "id=\"ontology\"", "id=\"benchmark\"", "id=\"limits\""]; positions=[html.index(marker) for marker in markers]; assert positions == sorted(positions), positions'
          echo "Published daily AI infrastructure verified: $base/"
          echo "Published research workbench verified: $base/resilience/"
          echo "Published NAND financial database verified: $base/api/v3/financial-database/index.json"
