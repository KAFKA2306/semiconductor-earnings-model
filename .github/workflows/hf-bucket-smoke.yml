name: Hugging Face central data lake publisher

# Sole HF writer. Other repositories must not carry HF credentials or Trusted Publishers.
on:
  pull_request:
    paths:
      - data/edinetdb_projections/**
      - data/earnings_ledger/**
      - data/financial_db/**
      - config/data_lake_publish.json
      - config/edinetdb_quota_plan.json
      - config/investor2_yahoo_market_cache.json
      - scripts/build_data_lake_bundle.py
      - scripts/publish_investor2_jquants_private.py
      - scripts/publish_investor2_yahoo_market_cache.py
      - tests/test_build_data_lake_bundle.py
      - tests/test_publish_investor2_jquants_private.py
      - tests/test_publish_investor2_yahoo_market_cache.py
      - docs/central-data-lake.md
      - .github/workflows/hf-bucket-smoke.yml
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Fail closed unless the dispatched revision matches this source SHA"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "47 */2 * * *"
  push:
    branches:
      - main
    paths:
      - data/edinetdb_projections/**
      - data/earnings_ledger/**
      - data/financial_db/**
      - config/data_lake_publish.json
      - config/edinetdb_quota_plan.json
      - config/investor2_yahoo_market_cache.json
      - scripts/build_data_lake_bundle.py
      - scripts/publish_investor2_jquants_private.py
      - scripts/publish_investor2_yahoo_market_cache.py
      - tests/test_build_data_lake_bundle.py
      - tests/test_publish_investor2_jquants_private.py
      - tests/test_publish_investor2_yahoo_market_cache.py
      - docs/central-data-lake.md
      - .github/workflows/hf-bucket-smoke.yml

permissions:
  contents: read

concurrency:
  group: central-hf-data-lake-publisher-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dispatched source revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_source_sha != ''
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Ref moved before publisher dispatch: expected $EXPECTED_SOURCE_SHA, got $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Validate fail-closed publish contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest \
            tests/test_build_data_lake_bundle.py \
            tests/test_publish_investor2_jquants_private.py \
            tests/test_publish_investor2_yahoo_market_cache.py
          python scripts/build_data_lake_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output .data_lake_bundle

  publish:
    needs: validate-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
      HF_BUCKET: k4fka/kafka-data-lake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build validated publish bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_data_lake_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output .data_lake_bundle

      - name: Install current Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify private bucket and OIDC round trip with residue-free cleanup
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/hf-smoke.json
          DST=/tmp/hf-smoke-readback.json
          REMOTE=".smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/payload.json"
          CLEANUP_REQUIRED=0

          cleanup_best_effort() {
            if [ "$CLEANUP_REQUIRED" = "1" ]; then
              hf buckets rm "$HF_BUCKET/$REMOTE" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_best_effort EXIT

          printf '{"schema":"hf-bucket-smoke.v4","source":"synthetic-only","run_id":"%s","attempt":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$SRC"
          EXPECTED_SHA=$(sha256sum "$SRC" | awk '{print $1}')

          hf buckets cp "$SRC" "hf://buckets/$HF_BUCKET/$REMOTE"
          CLEANUP_REQUIRED=1
          hf buckets cp "hf://buckets/$HF_BUCKET/$REMOTE" "$DST"
          ACTUAL_SHA=$(sha256sum "$DST" | awk '{print $1}')
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          INFO=$(hf buckets info "$HF_BUCKET")
          printf '%s\n' "$INFO"
          printf '%s\n' "$INFO" | grep -q '"private": true'

          hf buckets rm "$HF_BUCKET/$REMOTE" --yes
          CLEANUP_REQUIRED=0
          if hf buckets list "$HF_BUCKET/.smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -R -q | grep -q 'payload.json'; then
            echo "Smoke object still exists after cleanup" >&2
            exit 1
          fi

          echo "HF_SMOKE_RESULT=PASS"
          echo "HF_SMOKE_SHA256=$ACTUAL_SHA"
          echo "HF_SMOKE_CLEANUP=PASS"

      - name: Publish immutable investor2 Yahoo market cache once
        id: yahoo_cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_CONFIG=config/investor2_yahoo_market_cache.json
          python -m pip install pandas pyarrow 'yfinance[repair]'
          python scripts/publish_investor2_yahoo_market_cache.py \
            --config "$CACHE_CONFIG" \
            | tee /tmp/yahoo-market-cache-publish.log

      - name: Record verified Yahoo market cache evidence
        if: steps.yahoo_cache.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CACHE_CONFIG=config/investor2_yahoo_market_cache.json
          IFS=$'\t' read -r CACHE_BUCKET CACHE_PREFIX CACHE_WRITER EVIDENCE_ISSUE < <(
            python - "$CACHE_CONFIG" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          issue = config.get('evidence_issue')
          print(
              config['bucket'],
              config['base_prefix'],
              config['writer_repository'],
              '' if issue is None else issue,
              sep='\t',
          )
          PY
          )
          test "$CACHE_BUCKET" = "$HF_BUCKET"

          MANIFEST=/tmp/yahoo-market-cache-manifest.json
          hf buckets cp "hf://buckets/$CACHE_BUCKET/$CACHE_PREFIX/manifest.json" "$MANIFEST"
          BOOTSTRAP_RESULT=$(grep '^YAHOO_MARKET_CACHE_RESULT=' /tmp/yahoo-market-cache-publish.log | tail -1 | cut -d= -f2-)
          case "$BOOTSTRAP_RESULT" in
            PUBLISHED|SKIP_ALREADY_PUBLISHED) ;;
            *) echo "Unexpected Yahoo cache result: $BOOTSTRAP_RESULT" >&2; exit 1 ;;
          esac

          python - "$MANIFEST" "$BOOTSTRAP_RESULT" "$CACHE_CONFIG" > /tmp/yahoo-market-cache-evidence.md <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          bootstrap_result = sys.argv[2]
          config = json.loads(Path(sys.argv[3]).read_text(encoding='utf-8'))
          raw = manifest_path.read_bytes()
          payload = json.loads(raw)
          assert payload['schema_version'] == 'investor2.market-snapshot.v2'
          assert payload['source'] == 'Yahoo Finance via yfinance'
          assert payload['immutable'] is True
          assert payload['regions'] == config['regions']
          assert payload['start'] == config['start']
          assert payload['end_exclusive'] == config['end_exclusive']
          assert payload['benchmark'] == config['benchmark']
          storage = payload['storage_contract']
          assert storage['writer_repository'] == config['writer_repository']
          assert storage['bucket'] == config['bucket']
          assert storage['prefix'] == config['base_prefix']
          files = payload['files']
          assert isinstance(files, list) and files
          provenance = payload.get('provenance', {})
          print(f'YAHOO_MARKET_CACHE_BOOTSTRAP_RESULT={bootstrap_result}')
          print('YAHOO_MARKET_CACHE_RESULT=VERIFIED')
          print(f"YAHOO_MARKET_CACHE_TICKERS={payload['ticker_count']}")
          print(f"YAHOO_MARKET_CACHE_FILES={len(files)}")
          print(f"YAHOO_MARKET_CACHE_RANGE={payload['start']}..{payload['end_exclusive']}")
          print(f"YAHOO_MARKET_CACHE_SOURCE_REVISION={provenance.get('revision', 'unknown')}")
          print(f"YAHOO_MARKET_CACHE_PUBLISHER_REVISION={provenance.get('publisher_revision', 'unknown')}")
          print(f"YAHOO_MARKET_CACHE_PUBLISHER_RUN_ID={provenance.get('publisher_run_id', 'unknown')}")
          print(f'YAHOO_MARKET_CACHE_MANIFEST_SHA256={hashlib.sha256(raw).hexdigest()}')
          print(f"YAHOO_MARKET_CACHE_PREFIX={config['base_prefix']}")
          PY
          printf 'EVIDENCE_RUN=https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/yahoo-market-cache-evidence.md
          cat /tmp/yahoo-market-cache-evidence.md
          if [ -n "$EVIDENCE_ISSUE" ]; then
            gh issue comment "$EVIDENCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/yahoo-market-cache-evidence.md
          fi

      - name: Record Yahoo market cache failure
        if: failure() && steps.yahoo_cache.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CACHE_CONFIG=config/investor2_yahoo_market_cache.json
          EVIDENCE_ISSUE=$(python - "$CACHE_CONFIG" <<'PY'
          import json
          import sys
          from pathlib import Path

          issue = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8')).get('evidence_issue')
          print('' if issue is None else issue)
          PY
          )
          if [ -n "$EVIDENCE_ISSUE" ]; then
            gh issue comment "$EVIDENCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "YAHOO_MARKET_CACHE_RESULT=FAILED
          EVIDENCE_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

      - name: Publish investor2 J-Quants data to private bucket only
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$JQUANTS_API_KEY" ]; then
            echo "JQUANTS_PRIVATE_RESULT=SKIP_MISSING_SECRET"
            exit 0
          fi

          PRIVATE_ROOT="central/investor2/private/jquants"
          LATEST_REMOTE="$PRIVATE_ROOT/latest.json"
          RUN_REMOTE="$PRIVATE_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          CURRENT=/tmp/investor2-jquants-current.json
          PREVIOUS=/tmp/investor2-jquants-previous.json
          READBACK=/tmp/investor2-jquants-readback.json

          if hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_REMOTE" "$PREVIOUS" >/dev/null 2>&1; then
            if python - "$PREVIOUS" <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          generated = datetime.fromisoformat(payload['generated_at']).astimezone(ZoneInfo('Asia/Tokyo')).date()
          now = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          raise SystemExit(0 if generated == now else 1)
          PY
            then
              echo "JQUANTS_PRIVATE_RESULT=SKIP_ALREADY_CURRENT"
              exit 0
            fi
          fi

          python scripts/publish_investor2_jquants_private.py \
            --output "$CURRENT" \
            --lookback-days 730 \
            --minimum-interval-seconds 13

          EXPECTED_SHA=$(sha256sum "$CURRENT" | awk '{print $1}')
          hf buckets cp "$CURRENT" "hf://buckets/$HF_BUCKET/$RUN_REMOTE"
          hf buckets cp "hf://buckets/$HF_BUCKET/$RUN_REMOTE" "$READBACK"
          test "$EXPECTED_SHA" = "$(sha256sum "$READBACK" | awk '{print $1}')"

          hf buckets cp "$CURRENT" "hf://buckets/$HF_BUCKET/$LATEST_REMOTE"
          rm -f "$READBACK"
          hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_REMOTE" "$READBACK"
          test "$EXPECTED_SHA" = "$(sha256sum "$READBACK" | awk '{print $1}')"

          python - "$CURRENT" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          assert payload['visibility_contract']['storage'] == 'private_only'
          assert payload['visibility_contract']['public_git_storage'] is False
          assert payload['universe']['company_count'] == 10
          assert payload['record_count'] > 0
          print('JQUANTS_PRIVATE_RESULT=PASS')
          print(f"JQUANTS_PRIVATE_COMPANY_COUNT={payload['universe']['company_count']}")
          print(f"JQUANTS_PRIVATE_RECORD_COUNT={payload['record_count']}")
          print(f"JQUANTS_PRIVATE_SERIES_SHA256={payload['series_sha256']}")
          PY
          echo "JQUANTS_PRIVATE_FILE_SHA256=$EXPECTED_SHA"
          echo "JQUANTS_PRIVATE_REMOTE=$LATEST_REMOTE"

      - name: Publish investor2 Polymarket snapshot through hf-cache-hub
        shell: bash
        run: |
          set -euo pipefail
          INVESTOR2_DIR=/tmp/investor2
          HF_CACHE_HUB_DIR=/tmp/hf-cache-hub
          SNAPSHOT=/tmp/investor2-polymarket-snapshot.json
          POINTER=/tmp/investor2-polymarket-latest.json
          MANIFEST=/tmp/investor2-polymarket-artifacts.yaml
          HF_CACHE_HUB_REVISION=b41ca5a6601a6ac7724cb09b3fe90554c7356d69

          rm -rf "$INVESTOR2_DIR" "$HF_CACHE_HUB_DIR"
          git clone --filter=blob:none --no-checkout https://github.com/KAFKA2306/investor2.git "$INVESTOR2_DIR"
          git -C "$INVESTOR2_DIR" fetch --depth=1 origin main
          INVESTOR2_SHA=$(git -C "$INVESTOR2_DIR" rev-parse FETCH_HEAD)
          git -C "$INVESTOR2_DIR" checkout --detach "$INVESTOR2_SHA"

          git clone --filter=blob:none --no-checkout https://github.com/KAFKA2306/hf-cache-hub.git "$HF_CACHE_HUB_DIR"
          git -C "$HF_CACHE_HUB_DIR" fetch --depth=1 origin "$HF_CACHE_HUB_REVISION"
          git -C "$HF_CACHE_HUB_DIR" checkout --detach "$HF_CACHE_HUB_REVISION"

          python -m pip install \
            'requests==2.32.5' \
            'pydantic==2.12.5' \
            'PyYAML>=6,<7' \
            'huggingface-hub>=1.19,<2'

          python "$INVESTOR2_DIR/scripts/polymarket_snapshot.py" \
            --output "$SNAPSHOT" \
            --max-markets 20 \
            --min-liquidity 1000 \
            >/tmp/investor2-polymarket-collector-status.json

          INVESTOR2_SHA="$INVESTOR2_SHA" \
          HF_CACHE_HUB_REVISION="$HF_CACHE_HUB_REVISION" \
          SNAPSHOT="$SNAPSHOT" POINTER="$POINTER" MANIFEST="$MANIFEST" \
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          import yaml

          snapshot_path = Path(os.environ['SNAPSHOT'])
          pointer_path = Path(os.environ['POINTER'])
          manifest_path = Path(os.environ['MANIFEST'])
          payload = json.loads(snapshot_path.read_text(encoding='utf-8'))

          assert payload['schema_version'] == 'investor2.polymarket-market-snapshot.v1'
          assert payload['source'] == 'polymarket_market_data'
          assert payload['provenance']['storage_visibility'] == 'private-only'
          assert payload['records']

          source_revision = os.environ['INVESTOR2_SHA']
          publisher_revision = os.environ['GITHUB_SHA']
          hf_cache_revision = os.environ['HF_CACHE_HUB_REVISION']
          run_id = os.environ['GITHUB_RUN_ID']
          run_attempt = os.environ['GITHUB_RUN_ATTEMPT']
          bucket = os.environ['HF_BUCKET']

          observed = datetime.fromisoformat(payload['observed_at'].replace('Z', '+00:00'))
          run_remote = (
              'central/investor2/private/polymarket/observations/'
              f"{observed:%Y/%m/%d/%H}/{run_id}-{run_attempt}.json"
          )
          latest_remote = 'central/investor2/private/polymarket/latest.json'

          snapshot_bytes = snapshot_path.read_bytes()
          snapshot_sha = hashlib.sha256(snapshot_bytes).hexdigest()

          pointer = {
              'schema_version': 'investor2.polymarket-cache-pointer.v1',
              'source': 'polymarket_market_data',
              'observed_at': payload['observed_at'],
              'snapshot': {
                  'bucket': bucket,
                  'path': run_remote,
                  'sha256': snapshot_sha,
                  'size_bytes': len(snapshot_bytes),
              },
              'provenance': {
                  'repository': 'KAFKA2306/investor2',
                  'revision': source_revision,
                  'publisher_repository': 'KAFKA2306/semiconductor-earnings-model',
                  'publisher_revision': publisher_revision,
                  'run_id': run_id,
                  'run_attempt': run_attempt,
                  'hf_cache_hub_revision': hf_cache_revision,
              },
          }
          pointer_text = json.dumps(pointer, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          pointer_path.write_text(pointer_text, encoding='utf-8')
          pointer_bytes = pointer_text.encode('utf-8')
          pointer_sha = hashlib.sha256(pointer_bytes).hexdigest()

          manifest = {
              'schema_version': 1,
              'artifacts': [
                  {
                      'id': 'investor2/polymarket/snapshot',
                      'kind': 'dataset',
                      'format': 'json',
                      'storage': {
                          'type': 'huggingface-bucket',
                          'bucket': bucket,
                          'path': run_remote,
                      },
                      'size_bytes': len(snapshot_bytes),
                      'sha256': snapshot_sha,
                      'provenance': {
                          'repository': 'KAFKA2306/investor2',
                          'revision': source_revision,
                          'run_id': run_id,
                      },
                  },
                  {
                      'id': 'investor2/polymarket/latest',
                      'kind': 'dataset',
                      'format': 'json',
                      'storage': {
                          'type': 'huggingface-bucket',
                          'bucket': bucket,
                          'path': latest_remote,
                      },
                      'size_bytes': len(pointer_bytes),
                      'sha256': pointer_sha,
                      'provenance': {
                          'repository': 'KAFKA2306/semiconductor-earnings-model',
                          'revision': publisher_revision,
                          'run_id': run_id,
                      },
                  },
              ],
          }
          manifest_path.write_text(yaml.safe_dump(manifest, sort_keys=False), encoding='utf-8')

          print('POLYMARKET_CACHE_PREPARE=PASS')
          print(f'POLYMARKET_SOURCE_REVISION={source_revision}')
          print(f'POLYMARKET_SNAPSHOT_SHA256={snapshot_sha}')
          print(f'POLYMARKET_REMOTE={run_remote}')
          PY

          python "$HF_CACHE_HUB_DIR/scripts/artifact_manager.py" \
            --manifest "$MANIFEST" validate \
            >/tmp/investor2-polymarket-manifest-validation.json

          python "$HF_CACHE_HUB_DIR/scripts/artifact_manager.py" \
            --manifest "$MANIFEST" publish "$SNAPSHOT" \
            --id investor2/polymarket/snapshot \
            >/tmp/investor2-polymarket-snapshot-publish.json

          python "$HF_CACHE_HUB_DIR/scripts/artifact_manager.py" \
            --manifest "$MANIFEST" publish "$POINTER" \
            --id investor2/polymarket/latest \
            >/tmp/investor2-polymarket-pointer-publish.json

          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              '/tmp/investor2-polymarket-snapshot-publish.json',
              '/tmp/investor2-polymarket-pointer-publish.json',
          ):
              result = json.loads(Path(path).read_text(encoding='utf-8'))
              assert result['status'] == 'PUBLISHED'
              assert result['remote_verified'] is True
          print('POLYMARKET_HF_CACHE_RESULT=PASS')
          PY

      - name: Exact-mirror allow-listed prefixes and verify every object
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          }

          python - <<'PY' > /tmp/data-lake-roots.tsv
          import json
          from pathlib import Path
          manifest = json.loads(Path('.data_lake_bundle/manifest.json').read_text())
          for item in manifest['roots']:
              print(item['destination'])
          PY

          INDEX=0
          while IFS= read -r DESTINATION; do
            [ -n "$DESTINATION" ] || continue
            INDEX=$((INDEX + 1))
            LOCAL=".data_lake_bundle/payload/$DESTINATION"
            REMOTE="hf://buckets/$HF_BUCKET/$DESTINATION"
            PLAN="/tmp/data-lake-plan-$INDEX.jsonl"
            POST_PLAN="/tmp/data-lake-post-plan-$INDEX.jsonl"

            test -d "$LOCAL"
            echo "=== preview $DESTINATION ==="
            hf buckets sync "$LOCAL" "$REMOTE" --delete --dry-run > "$PLAN"
            cat "$PLAN"

            echo "=== apply $DESTINATION ==="
            retry hf buckets sync "$LOCAL" "$REMOTE" --delete

            hf buckets sync "$LOCAL" "$REMOTE" --delete --ignore-times --dry-run > "$POST_PLAN"
            python - "$POST_PLAN" <<'PY'
          import json
          import sys
          from pathlib import Path

          changes = []
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              item = json.loads(raw)
              if item.get('action') in {'upload', 'download', 'delete'}:
                  changes.append(item)
          if changes:
              raise SystemExit(f'post-sync plan is not empty: {changes[:5]}')
          PY
          done < /tmp/data-lake-roots.tsv

          python - <<'PY' > /tmp/data-lake-files.tsv
          import json
          from pathlib import Path
          manifest = json.loads(Path('.data_lake_bundle/manifest.json').read_text())
          for item in manifest['files']:
              print(f"{item['bundle_path']}\t{item['remote_path']}\t{item['sha256']}")
          PY

          INDEX=0
          while IFS=$'\t' read -r BUNDLE_PATH REMOTE_PATH EXPECTED_SHA; do
            [ -n "$BUNDLE_PATH" ] || continue
            INDEX=$((INDEX + 1))
            READBACK="/tmp/data-lake-readback-$INDEX"
            retry hf buckets cp "hf://buckets/$HF_BUCKET/$REMOTE_PATH" "$READBACK"
            ACTUAL_SHA=$(sha256sum "$READBACK" | awk '{print $1}')
            test "$EXPECTED_SHA" = "$ACTUAL_SHA"
            echo "VERIFIED $REMOTE_PATH $ACTUAL_SHA"
          done < /tmp/data-lake-files.tsv

          MANIFEST=.data_lake_bundle/manifest.json
          MANIFEST_SHA=$(sha256sum "$MANIFEST" | awk '{print $1}')
          RUN_MANIFEST="central/manifests/runs/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          LATEST_MANIFEST="central/manifests/latest.json"

          retry hf buckets cp "$MANIFEST" "hf://buckets/$HF_BUCKET/$RUN_MANIFEST"
          retry hf buckets cp "hf://buckets/$HF_BUCKET/$RUN_MANIFEST" /tmp/run-manifest-readback.json
          test "$MANIFEST_SHA" = "$(sha256sum /tmp/run-manifest-readback.json | awk '{print $1}')"

          retry hf buckets cp "$MANIFEST" "hf://buckets/$HF_BUCKET/$LATEST_MANIFEST"
          retry hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_MANIFEST" /tmp/latest-manifest-readback.json
          test "$MANIFEST_SHA" = "$(sha256sum /tmp/latest-manifest-readback.json | awk '{print $1}')"

          FILE_COUNT=$(python -c "import json; print(json.load(open('$MANIFEST'))['file_count'])")
          echo "HF_DATA_LAKE_RESULT=PASS"
          echo "HF_DATA_LAKE_FILE_COUNT=$FILE_COUNT"
          echo "HF_DATA_LAKE_MANIFEST_SHA256=$MANIFEST_SHA"
