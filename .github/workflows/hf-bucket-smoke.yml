name: Hugging Face central data lake publisher

# Sole HF writer. Other repositories must not carry HF credentials or Trusted Publishers.
on:
  pull_request:
    paths:
      - data/edinetdb_projections/**
      - data/earnings_ledger/**
      - data/financial_db/**
      - config/data_lake_publish.json
      - config/edinetdb_quota_plan.json
      - scripts/build_data_lake_bundle.py
      - scripts/publish_investor2_jquants_private.py
      - tests/test_build_data_lake_bundle.py
      - tests/test_publish_investor2_jquants_private.py
      - docs/central-data-lake.md
      - .github/workflows/hf-bucket-smoke.yml
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Fail closed unless the dispatched revision matches this source SHA"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "47 */2 * * *"
  push:
    branches:
      - main
    paths:
      - data/edinetdb_projections/**
      - data/earnings_ledger/**
      - data/financial_db/**
      - config/data_lake_publish.json
      - config/edinetdb_quota_plan.json
      - scripts/build_data_lake_bundle.py
      - scripts/publish_investor2_jquants_private.py
      - tests/test_build_data_lake_bundle.py
      - tests/test_publish_investor2_jquants_private.py
      - docs/central-data-lake.md
      - .github/workflows/hf-bucket-smoke.yml

permissions:
  contents: read

concurrency:
  group: central-hf-data-lake-publisher-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dispatched source revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_source_sha != ''
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Ref moved before publisher dispatch: expected $EXPECTED_SOURCE_SHA, got $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Validate fail-closed publish contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest \
            tests/test_build_data_lake_bundle.py \
            tests/test_publish_investor2_jquants_private.py
          python scripts/build_data_lake_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output .data_lake_bundle

  publish:
    needs: validate-contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
      HF_BUCKET: k4fka/kafka-data-lake
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build validated publish bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_data_lake_bundle.py \
            --source-revision "$GITHUB_SHA" \
            --output .data_lake_bundle

      - name: Install current Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify private bucket and OIDC round trip with residue-free cleanup
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/hf-smoke.json
          DST=/tmp/hf-smoke-readback.json
          REMOTE=".smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/payload.json"
          CLEANUP_REQUIRED=0

          cleanup_best_effort() {
            if [ "$CLEANUP_REQUIRED" = "1" ]; then
              hf buckets rm "$HF_BUCKET/$REMOTE" --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_best_effort EXIT

          printf '{"schema":"hf-bucket-smoke.v4","source":"synthetic-only","run_id":"%s","attempt":"%s"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$SRC"
          EXPECTED_SHA=$(sha256sum "$SRC" | awk '{print $1}')

          hf buckets cp "$SRC" "hf://buckets/$HF_BUCKET/$REMOTE"
          CLEANUP_REQUIRED=1
          hf buckets cp "hf://buckets/$HF_BUCKET/$REMOTE" "$DST"
          ACTUAL_SHA=$(sha256sum "$DST" | awk '{print $1}')
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"

          INFO=$(hf buckets info "$HF_BUCKET")
          printf '%s\n' "$INFO"
          printf '%s\n' "$INFO" | grep -q '"private": true'

          hf buckets rm "$HF_BUCKET/$REMOTE" --yes
          CLEANUP_REQUIRED=0
          if hf buckets list "$HF_BUCKET/.smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -R -q | grep -q 'payload.json'; then
            echo "Smoke object still exists after cleanup" >&2
            exit 1
          fi

          echo "HF_SMOKE_RESULT=PASS"
          echo "HF_SMOKE_SHA256=$ACTUAL_SHA"
          echo "HF_SMOKE_CLEANUP=PASS"

      - name: Publish investor2 J-Quants data to private bucket only
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          set -euo pipefail
          PRIVATE_ROOT="central/investor2/private/jquants"
          LATEST_REMOTE="$PRIVATE_ROOT/latest.json"
          RUN_REMOTE="$PRIVATE_ROOT/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          CURRENT=/tmp/investor2-jquants-current.json
          PREVIOUS=/tmp/investor2-jquants-previous.json
          READBACK=/tmp/investor2-jquants-readback.json

          if hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_REMOTE" "$PREVIOUS" >/dev/null 2>&1; then
            if python - "$PREVIOUS" <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          generated = datetime.fromisoformat(payload['generated_at']).astimezone(ZoneInfo('Asia/Tokyo')).date()
          now = datetime.now(ZoneInfo('Asia/Tokyo')).date()
          raise SystemExit(0 if generated == now else 1)
          PY
            then
              echo "JQUANTS_PRIVATE_RESULT=SKIP_ALREADY_CURRENT"
              exit 0
            fi
          fi

          test -n "$JQUANTS_API_KEY"
          python scripts/publish_investor2_jquants_private.py \
            --output "$CURRENT" \
            --lookback-days 730 \
            --minimum-interval-seconds 13

          EXPECTED_SHA=$(sha256sum "$CURRENT" | awk '{print $1}')
          hf buckets cp "$CURRENT" "hf://buckets/$HF_BUCKET/$RUN_REMOTE"
          hf buckets cp "hf://buckets/$HF_BUCKET/$RUN_REMOTE" "$READBACK"
          test "$EXPECTED_SHA" = "$(sha256sum "$READBACK" | awk '{print $1}')"

          hf buckets cp "$CURRENT" "hf://buckets/$HF_BUCKET/$LATEST_REMOTE"
          rm -f "$READBACK"
          hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_REMOTE" "$READBACK"
          test "$EXPECTED_SHA" = "$(sha256sum "$READBACK" | awk '{print $1}')"

          python - "$CURRENT" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          assert payload['visibility_contract']['storage'] == 'private_only'
          assert payload['visibility_contract']['public_git_storage'] is False
          assert payload['universe']['company_count'] == 10
          assert payload['record_count'] > 0
          print('JQUANTS_PRIVATE_RESULT=PASS')
          print(f"JQUANTS_PRIVATE_COMPANY_COUNT={payload['universe']['company_count']}")
          print(f"JQUANTS_PRIVATE_RECORD_COUNT={payload['record_count']}")
          print(f"JQUANTS_PRIVATE_SERIES_SHA256={payload['series_sha256']}")
          PY
          echo "JQUANTS_PRIVATE_FILE_SHA256=$EXPECTED_SHA"
          echo "JQUANTS_PRIVATE_REMOTE=$LATEST_REMOTE"

      - name: Exact-mirror allow-listed prefixes and verify every object
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                return 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
          }

          python - <<'PY' > /tmp/data-lake-roots.tsv
          import json
          from pathlib import Path
          manifest = json.loads(Path('.data_lake_bundle/manifest.json').read_text())
          for item in manifest['roots']:
              print(item['destination'])
          PY

          INDEX=0
          while IFS= read -r DESTINATION; do
            [ -n "$DESTINATION" ] || continue
            INDEX=$((INDEX + 1))
            LOCAL=".data_lake_bundle/payload/$DESTINATION"
            REMOTE="hf://buckets/$HF_BUCKET/$DESTINATION"
            PLAN="/tmp/data-lake-plan-$INDEX.jsonl"
            POST_PLAN="/tmp/data-lake-post-plan-$INDEX.jsonl"

            test -d "$LOCAL"
            echo "=== preview $DESTINATION ==="
            hf buckets sync "$LOCAL" "$REMOTE" --delete --dry-run > "$PLAN"
            cat "$PLAN"

            echo "=== apply $DESTINATION ==="
            retry hf buckets sync "$LOCAL" "$REMOTE" --delete

            hf buckets sync "$LOCAL" "$REMOTE" --delete --ignore-times --dry-run > "$POST_PLAN"
            python - "$POST_PLAN" <<'PY'
          import json
          import sys
          from pathlib import Path

          changes = []
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              item = json.loads(raw)
              if item.get('action') in {'upload', 'download', 'delete'}:
                  changes.append(item)
          if changes:
              raise SystemExit(f'post-sync plan is not empty: {changes[:5]}')
          PY
          done < /tmp/data-lake-roots.tsv

          python - <<'PY' > /tmp/data-lake-files.tsv
          import json
          from pathlib import Path
          manifest = json.loads(Path('.data_lake_bundle/manifest.json').read_text())
          for item in manifest['files']:
              print(f"{item['bundle_path']}\t{item['remote_path']}\t{item['sha256']}")
          PY

          INDEX=0
          while IFS=$'\t' read -r BUNDLE_PATH REMOTE_PATH EXPECTED_SHA; do
            [ -n "$BUNDLE_PATH" ] || continue
            INDEX=$((INDEX + 1))
            READBACK="/tmp/data-lake-readback-$INDEX"
            retry hf buckets cp "hf://buckets/$HF_BUCKET/$REMOTE_PATH" "$READBACK"
            ACTUAL_SHA=$(sha256sum "$READBACK" | awk '{print $1}')
            test "$EXPECTED_SHA" = "$ACTUAL_SHA"
            echo "VERIFIED $REMOTE_PATH $ACTUAL_SHA"
          done < /tmp/data-lake-files.tsv

          MANIFEST=.data_lake_bundle/manifest.json
          MANIFEST_SHA=$(sha256sum "$MANIFEST" | awk '{print $1}')
          RUN_MANIFEST="central/manifests/runs/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          LATEST_MANIFEST="central/manifests/latest.json"

          retry hf buckets cp "$MANIFEST" "hf://buckets/$HF_BUCKET/$RUN_MANIFEST"
          retry hf buckets cp "hf://buckets/$HF_BUCKET/$RUN_MANIFEST" /tmp/run-manifest-readback.json
          test "$MANIFEST_SHA" = "$(sha256sum /tmp/run-manifest-readback.json | awk '{print $1}')"

          retry hf buckets cp "$MANIFEST" "hf://buckets/$HF_BUCKET/$LATEST_MANIFEST"
          retry hf buckets cp "hf://buckets/$HF_BUCKET/$LATEST_MANIFEST" /tmp/latest-manifest-readback.json
          test "$MANIFEST_SHA" = "$(sha256sum /tmp/latest-manifest-readback.json | awk '{print $1}')"

          FILE_COUNT=$(python -c "import json; print(json.load(open('$MANIFEST'))['file_count'])")
          echo "HF_DATA_LAKE_RESULT=PASS"
          echo "HF_DATA_LAKE_FILE_COUNT=$FILE_COUNT"
          echo "HF_DATA_LAKE_MANIFEST_SHA256=$MANIFEST_SHA"
