name: Earnings source state

on:
  pull_request:
    paths:
      - ".github/workflows/earnings-source-state.yml"
      - "scripts/build_earnings_source_state.py"
      - "tests/test_earnings_source_state.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-source-state.yml"
      - "scripts/build_earnings_source_state.py"
      - "tests/test_earnings_source_state.py"
  workflow_run:
    workflows: ["Earnings ledger update"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: earnings-source-state-${{ github.event_name }}-${{ github.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-source-state:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run source-state regression tests
        run: python -m pytest -q tests/test_earnings_source_state.py

      - name: Build fail-closed source cursor state
        run: python scripts/build_earnings_source_state.py

      - name: Commit validated source state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/source_state.json)" ]; then
            echo "No source-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger/source_state.json
          git commit -m "data: update earnings source state"
          git pull --rebase origin main
          git push origin HEAD:main
