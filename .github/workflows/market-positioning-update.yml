name: Update market positioning data

on:
  schedule:
    # 07:30 JST Monday-Friday (22:30 UTC Sunday-Thursday)
    - cron: "30 22 * * 0-4"
    # 18:30 JST Monday-Friday (09:30 UTC Monday-Friday), after JPX daily releases
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/market_positioning_core.py"
      - "scripts/update_market_positioning.py"
      - "tests/test_market_positioning_pipeline.py"
      - "data/market_positioning/**"
      - ".github/workflows/market-positioning-update.yml"
  push:
    branches: [main]
    paths:
      - "scripts/market_positioning_core.py"
      - "scripts/update_market_positioning.py"
      - "tests/test_market_positioning_pipeline.py"
      - "data/market_positioning/source_registry.json"
      - ".github/workflows/market-positioning-update.yml"

permissions:
  contents: write

concurrency:
  group: market-positioning-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic environment
        run: uv sync --frozen
      - name: Validate parsers and derived metrics
        run: uv run python -m pytest tests/test_market_positioning_pipeline.py -q
      - name: Collect official market positioning data
        if: github.event_name != 'pull_request'
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: uv run python scripts/update_market_positioning.py --strict
      - name: Verify repository publication contract
        run: uv run python scripts/check_readme_pages_link.py
      - name: Commit ledger changes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/market_positioning/observations.json \
            data/market_positioning/collection_state.json \
            site/public/api/v1/market-positioning/index.json
          if git diff --cached --quiet; then
            echo "No market positioning changes"
            exit 0
          fi
          git commit -m "data: update market positioning series"
          git pull --rebase origin main
          git push origin HEAD:main
