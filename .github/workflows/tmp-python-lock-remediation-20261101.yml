name: Temporary Python lockfile remediation (branch only)
on:
  push:
    branches:
      - fix/python-lock-vulns-20261101
    paths:
      - pyproject.toml
permissions:
  contents: write
jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/python-lock-vulns-20261101
          persist-credentials: true
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.22"
      - name: Resolve minimum safe transitive dependencies
        run: |
          set -euo pipefail
          uv lock --upgrade-package certifi --upgrade-package urllib3 --upgrade-package langgraph-sdk
          uv lock --check
          git diff --check
          git diff -- uv.lock
      - name: Commit lockfile to this branch only
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "No lockfile changes; check constraints" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "fix(deps): regenerate uv lock with patched transitive versions"
          git push origin HEAD:refs/heads/fix/python-lock-vulns-20261101
