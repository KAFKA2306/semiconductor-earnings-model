name: Earnings ledger update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-ledger-update.yml"
      - "scripts/earnings_ledger.py"
      - "scripts/audit_earnings_evidence.py"
      - "scripts/audit_earnings_semantic_duplicates.py"
      - "scripts/normalize_earnings_periods.py"
      - "scripts/audit_earnings_accounting_basis.py"
      - "scripts/audit_earnings_rejection_reasons.py"
      - "scripts/audit_earnings_published_at.py"
      - "scripts/build_earnings_ledger_publication.py"
      - "tests/test_earnings_ledger.py"
      - "tests/test_earnings_evidence_audit.py"
      - "tests/test_earnings_semantic_duplicates.py"
      - "tests/test_earnings_period_normalization.py"
      - "tests/test_earnings_accounting_basis.py"
      - "tests/test_earnings_rejection_reasons.py"
      - "tests/test_earnings_published_at_audit.py"
      - "tests/test_earnings_ledger_publication.py"
      - "data/earnings_ledger/source_registry.json"
  pull_request:
    paths:
      - ".github/workflows/earnings-ledger-update.yml"
      - "scripts/earnings_ledger.py"
      - "scripts/audit_earnings_evidence.py"
      - "scripts/audit_earnings_semantic_duplicates.py"
      - "scripts/normalize_earnings_periods.py"
      - "scripts/audit_earnings_accounting_basis.py"
      - "scripts/audit_earnings_rejection_reasons.py"
      - "scripts/audit_earnings_published_at.py"
      - "scripts/build_earnings_ledger_publication.py"
      - "tests/test_earnings_ledger.py"
      - "tests/test_earnings_evidence_audit.py"
      - "tests/test_earnings_semantic_duplicates.py"
      - "tests/test_earnings_period_normalization.py"
      - "tests/test_earnings_accounting_basis.py"
      - "tests/test_earnings_rejection_reasons.py"
      - "tests/test_earnings_published_at_audit.py"
      - "tests/test_earnings_ledger_publication.py"
      - "data/earnings_ledger/source_registry.json"

permissions:
  contents: write

concurrency:
  group: earnings-ledger-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-audit-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run ledger unit tests
        run: python -m pytest -q tests/test_earnings_ledger.py tests/test_earnings_evidence_audit.py tests/test_earnings_semantic_duplicates.py tests/test_earnings_period_normalization.py tests/test_earnings_accounting_basis.py tests/test_earnings_rejection_reasons.py tests/test_earnings_published_at_audit.py tests/test_earnings_ledger_publication.py

      - name: Collect with retry
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set -u
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo "Repository variable SEC_USER_AGENT is required."
            exit 1
          fi
          ok=0
          for attempt in 1 2 3; do
            echo "collector attempt ${attempt}/3"
            if python scripts/earnings_ledger.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "collector failed after 3 attempts"
            exit 1
          fi

      - name: Deterministic post-collection audit
        run: python scripts/earnings_ledger.py --audit-only

      - name: Audit rejection reason taxonomy
        run: python scripts/audit_earnings_rejection_reasons.py

      - name: Reject semantic duplicate earnings events
        run: python scripts/audit_earnings_semantic_duplicates.py

      - name: Normalize primary reporting periods
        run: python scripts/normalize_earnings_periods.py

      - name: Audit GAAP/non-GAAP accounting basis
        run: python scripts/audit_earnings_accounting_basis.py

      - name: Verify SEC publication timestamps with retry
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            echo "published_at verification attempt ${attempt}/3"
            if python scripts/audit_earnings_published_at.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "SEC publication timestamp verification failed after 3 attempts"
            exit 1
          fi

      - name: Verify primary evidence content with retry
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            echo "evidence verification attempt ${attempt}/3"
            if python scripts/audit_earnings_evidence.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "primary evidence verification failed after 3 attempts"
            exit 1
          fi

      - name: Build audited public earnings API
        run: python scripts/build_earnings_ledger_publication.py

      - name: Commit validated ledger changes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- data/earnings_ledger site/public/api/v1/earnings-ledger; then
            echo "No ledger publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger site/public/api/v1/earnings-ledger
          git commit -m "data: update earnings event ledger"
          git push
