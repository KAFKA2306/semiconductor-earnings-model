name: Earnings ledger update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: earnings-ledger-update
  cancel-in-progress: false

jobs:
  collect-audit-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ledger unit tests
        run: python -m pytest -q tests/test_earnings_ledger.py

      - name: Collect with retry
        env:
          SEC_USER_AGENT: "KAFKA2306 semiconductor-earnings-model https://github.com/KAFKA2306/semiconductor-earnings-model"
        shell: bash
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            echo "collector attempt ${attempt}/3"
            if python scripts/earnings_ledger.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "collector failed after 3 attempts"
            exit 1
          fi

      - name: Deterministic post-collection audit
        run: python scripts/earnings_ledger.py --audit-only

      - name: Commit validated ledger changes
        shell: bash
        run: |
          if git diff --quiet -- data/earnings_ledger; then
            echo "No ledger changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger
          git commit -m "data: update earnings event ledger"
          git push
