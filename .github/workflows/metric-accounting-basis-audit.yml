name: Verified metric accounting-basis audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metric-accounting-basis-audit.yml"
      - "scripts/audit_verified_metric_accounting_basis.py"
      - "tests/test_verified_metric_accounting_basis_audit.py"
      - "data/earnings_ledger/verified_revenue_latest.json"
      - "data/earnings_ledger/verified_capex_latest.json"
      - "data/earnings_ledger/verified_inventory_latest.json"
      - "data/earnings_ledger/verified_fcf_latest.json"
      - "scripts/push_earnings_commit_with_retry.sh"
  pull_request:
    paths:
      - ".github/workflows/metric-accounting-basis-audit.yml"
      - "scripts/audit_verified_metric_accounting_basis.py"
      - "tests/test_verified_metric_accounting_basis_audit.py"
      - "data/earnings_ledger/verified_revenue_latest.json"
      - "data/earnings_ledger/verified_capex_latest.json"
      - "data/earnings_ledger/verified_inventory_latest.json"
      - "data/earnings_ledger/verified_fcf_latest.json"

permissions:
  contents: write

concurrency:
  group: verified-metric-accounting-basis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run accounting-basis regression tests
        run: python -m pytest -q tests/test_verified_metric_accounting_basis_audit.py

      - name: Audit persisted metric accounting basis
        run: python scripts/audit_verified_metric_accounting_basis.py

      - name: Commit accounting-basis audit artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/metric_accounting_basis_audit_latest.json)" ]; then
            echo "No accounting-basis audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger/metric_accounting_basis_audit_latest.json
          git commit -m "data: update metric accounting-basis audit"
          bash scripts/push_earnings_commit_with_retry.sh
