name: Earnings ledger lineage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/earnings-lineage.yml"
      - "scripts/build_earnings_lineage_manifest.py"
      - "tests/test_earnings_lineage_manifest.py"
      - "tests/test_earnings_lineage_derived_audits.py"
      - "data/earnings_ledger/events.ndjson"
      - "data/earnings_ledger/rejected.ndjson"
      - "data/earnings_ledger/source_registry.json"
      - "data/earnings_ledger/state.json"
      - "data/earnings_ledger/audit_latest.json"
      - "data/earnings_ledger/publication_latest.json"
      - "data/earnings_ledger/source_state.json"
      - "data/earnings_ledger/semantic_duplicate_audit_latest.json"
      - "data/earnings_ledger/period_normalization_latest.json"
      - "data/earnings_ledger/accounting_basis_audit_latest.json"
      - "data/earnings_ledger/rejection_reason_audit_latest.json"
      - "data/earnings_ledger/published_at_audit_latest.json"
      - "data/earnings_ledger/source_registry_audit_latest.json"
      - "data/earnings_ledger/consensus_separation_audit_latest.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-lineage.yml"
      - "scripts/build_earnings_lineage_manifest.py"
      - "tests/test_earnings_lineage_manifest.py"
      - "tests/test_earnings_lineage_derived_audits.py"
      - "data/earnings_ledger/events.ndjson"
      - "data/earnings_ledger/rejected.ndjson"
      - "data/earnings_ledger/source_registry.json"
      - "data/earnings_ledger/state.json"
      - "data/earnings_ledger/audit_latest.json"
      - "data/earnings_ledger/publication_latest.json"
      - "data/earnings_ledger/source_state.json"
      - "data/earnings_ledger/semantic_duplicate_audit_latest.json"
      - "data/earnings_ledger/period_normalization_latest.json"
      - "data/earnings_ledger/accounting_basis_audit_latest.json"
      - "data/earnings_ledger/rejection_reason_audit_latest.json"
      - "data/earnings_ledger/published_at_audit_latest.json"
      - "data/earnings_ledger/source_registry_audit_latest.json"
      - "data/earnings_ledger/consensus_separation_audit_latest.json"

permissions:
  contents: write

concurrency:
  group: earnings-lineage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run lineage regression tests
        run: python -m pytest -q tests/test_earnings_lineage_manifest.py tests/test_earnings_lineage_derived_audits.py

      - name: Build lineage manifest
        run: python scripts/build_earnings_lineage_manifest.py

      - name: Commit validated lineage manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/lineage_latest.json)" ]; then
            echo "No lineage changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger/lineage_latest.json
          git commit -m "data: update earnings ledger lineage"
          git push
