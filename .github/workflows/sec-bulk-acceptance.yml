name: SEC bulk acceptance

on:
  pull_request:
    paths:
      - 'scripts/sec_bulk.py'
      - 'scripts/extract_verified_sec_revenue.py'
      - 'tests/test_sec_bulk.py'
      - 'tests/test_sec_bulk_revenue_integration.py'
      - 'data/earnings_ledger/source_registry.json'
      - '.github/workflows/sec-bulk-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sec_bulk.py'
      - 'scripts/extract_verified_sec_revenue.py'
      - 'tests/test_sec_bulk.py'
      - 'tests/test_sec_bulk_revenue_integration.py'
      - 'data/earnings_ledger/source_registry.json'
      - '.github/workflows/sec-bulk-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_sec_bulk.py tests/test_sec_bulk_revenue_integration.py
      - run: python scripts/audit_earnings_source_registry.py
      - run: python scripts/earnings_ledger.py --audit-only

  live-bulk:
    strategy:
      fail-fast: false
      matrix:
        archive: [companyfacts, submissions]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require configured SEC request identity
        run: |
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo 'Repository variable SEC_USER_AGENT is required.' >&2
            exit 1
          fi
      - name: Materialize official SEC bulk subset
        run: >-
          python scripts/sec_bulk.py ${{ matrix.archive }}
          --output-dir data/sec_bulk
          --user-agent "$SEC_USER_AGENT"
      - name: Verify live manifest
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          archive = os.environ['ARCHIVE']
          path = Path('data/sec_bulk') / archive / 'manifest.json'
          manifest = json.loads(path.read_text())
          assert manifest['status'] == 'PASS'
          assert manifest['configured_sec_issuer_count'] >= 10
          assert manifest['normalized_issuer_count'] >= 10
          assert manifest['normalized_record_count'] > 0
          assert len(manifest['source']['sha256']) == 64
          assert len(manifest['normalized_sha256']) == 64
          assert manifest['normalization_schema'] == 'sec-normalized-record.v1'
          print(json.dumps({
              'archive': archive,
              'configured_sec_issuer_count': manifest['configured_sec_issuer_count'],
              'normalized_issuer_count': manifest['normalized_issuer_count'],
              'normalized_record_count': manifest['normalized_record_count'],
              'source_sha256': manifest['source']['sha256'],
              'normalized_sha256': manifest['normalized_sha256'],
              'source_url': manifest['source']['source_url'],
          }, sort_keys=True))
          PY
      - name: Regenerate existing verified revenue JSON from bulk base
        if: matrix.archive == 'companyfacts'
        run: |
          python scripts/extract_verified_sec_revenue.py
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('data/earnings_ledger/verified_revenue_latest.json').read_text())
          assert result['status'] == 'PASS'
          assert result['verified_metrics_total'] > 0
          assert all(metric.get('source_kind') in {'bulk', 'api_freshness_delta'} for metric in result['metrics'])
          assert any(metric.get('source_kind') == 'bulk' for metric in result['metrics'])
          print(json.dumps({
              'verified_metrics_total': result['verified_metrics_total'],
              'source_kinds': sorted({metric.get('source_kind') for metric in result['metrics']}),
          }, sort_keys=True))
          PY
      - name: Upload compact acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: sec-bulk-${{ matrix.archive }}-acceptance
          path: |
            data/sec_bulk/${{ matrix.archive }}/manifest.json
          if-no-files-found: error
          retention-days: 7
