name: Yahoo market cache evidence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/yahoo-market-cache-evidence.yml
  workflow_run:
    workflows: ["Hugging Face central data lake publisher"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
      HF_BUCKET: k4fka/kafka-data-lake
      CACHE_PREFIX: central/investor2/private/yahoo-market-cache/v1
      EVIDENCE_ISSUE: "149"
    steps:
      - name: Install current Hugging Face CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Read back immutable completion manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=/tmp/yahoo-market-cache-manifest.json
          REMOTE="hf://buckets/$HF_BUCKET/$CACHE_PREFIX/manifest.json"
          FOUND=0
          for attempt in $(seq 1 120); do
            if hf buckets cp "$REMOTE" "$MANIFEST" >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            sleep 15
          done
          if [ "$FOUND" != "1" ]; then
            echo "completion manifest was not observable after retry window" >&2
            exit 1
          fi

          python - "$MANIFEST" "$CACHE_PREFIX" <<'PY' >/tmp/yahoo-market-cache-evidence.env
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          prefix = sys.argv[2]
          raw = path.read_bytes()
          payload = json.loads(raw)
          assert payload['schema_version'] == 'investor2.market-snapshot.v2'
          assert payload['source'] == 'Yahoo Finance via yfinance'
          assert payload['immutable'] is True
          storage = payload['storage_contract']
          assert storage['writer_repository'] == 'KAFKA2306/semiconductor-earnings-model'
          assert storage['bucket'] == 'k4fka/kafka-data-lake'
          assert storage['prefix'] == prefix
          files = payload['files']
          assert isinstance(files, list) and files
          provenance = payload.get('provenance', {})
          print(f"RESULT=VERIFIED")
          print(f"TICKERS={payload['ticker_count']}")
          print(f"FILES={len(files)}")
          print(f"START={payload['start']}")
          print(f"END={payload['end_exclusive']}")
          print(f"SOURCE_REVISION={provenance.get('revision', 'unknown')}")
          print(f"PUBLISHER_REVISION={provenance.get('publisher_revision', 'unknown')}")
          print(f"PUBLISHER_RUN_ID={provenance.get('publisher_run_id', 'unknown')}")
          print(f"MANIFEST_SHA256={hashlib.sha256(raw).hexdigest()}")
          PY

          cat /tmp/yahoo-market-cache-evidence.env
          cat /tmp/yahoo-market-cache-evidence.env >> "$GITHUB_OUTPUT"

      - name: Publish evidence ledger entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.evidence.outputs.RESULT }}
          TICKERS: ${{ steps.evidence.outputs.TICKERS }}
          FILES: ${{ steps.evidence.outputs.FILES }}
          START: ${{ steps.evidence.outputs.START }}
          END: ${{ steps.evidence.outputs.END }}
          SOURCE_REVISION: ${{ steps.evidence.outputs.SOURCE_REVISION }}
          PUBLISHER_REVISION: ${{ steps.evidence.outputs.PUBLISHER_REVISION }}
          PUBLISHER_RUN_ID: ${{ steps.evidence.outputs.PUBLISHER_RUN_ID }}
          MANIFEST_SHA256: ${{ steps.evidence.outputs.MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          YAHOO_MARKET_CACHE_RESULT=$RESULT
          YAHOO_MARKET_CACHE_TICKERS=$TICKERS
          YAHOO_MARKET_CACHE_FILES=$FILES
          YAHOO_MARKET_CACHE_RANGE=$START..$END
          YAHOO_MARKET_CACHE_SOURCE_REVISION=$SOURCE_REVISION
          YAHOO_MARKET_CACHE_PUBLISHER_REVISION=$PUBLISHER_REVISION
          YAHOO_MARKET_CACHE_PUBLISHER_RUN_ID=$PUBLISHER_RUN_ID
          YAHOO_MARKET_CACHE_MANIFEST_SHA256=$MANIFEST_SHA256
          YAHOO_MARKET_CACHE_PREFIX=$CACHE_PREFIX
          EVIDENCE_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )
          gh issue comment "$EVIDENCE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "$BODY"
