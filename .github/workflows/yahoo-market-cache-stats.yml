name: Yahoo market cache stats audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/yahoo-market-cache-stats
    paths:
      - config/investor2_yahoo_market_cache.json
      - scripts/audit_investor2_yahoo_market_cache.py
      - tests/test_audit_investor2_yahoo_market_cache.py
      - .github/workflows/yahoo-market-cache-stats.yml

permissions:
  contents: read
  id-token: write

env:
  HF_OIDC_RESOURCE: buckets/k4fka/kafka-data-lake
  HF_BUCKET: k4fka/kafka-data-lake

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Load market-cache audit contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          config = json.loads(Path('config/investor2_yahoo_market_cache.json').read_text(encoding='utf-8'))
          audit = config.get('audit')
          if not isinstance(audit, dict):
              raise SystemExit('market-cache config has no audit contract')
          if config['bucket'] != os.environ['HF_BUCKET']:
              raise SystemExit('market-cache bucket disagrees with authenticated workflow bucket')
          manifest_sha = audit.get('canonical_manifest_sha256')
          if not isinstance(manifest_sha, str) or len(manifest_sha) != 64:
              raise SystemExit('invalid canonical_manifest_sha256')
          print(f"CACHE_PREFIX={config['base_prefix']}")
          print(f"EVIDENCE_PREFIX={audit['evidence_prefix']}")
          print(f"CANONICAL_MANIFEST_SHA256={manifest_sha}")
          PY

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9' pandas pyarrow "huggingface_hub==1.29.0"
          python -c 'import huggingface_hub; assert huggingface_hub.__version__ == "1.29.0", huggingface_hub.__version__'
          hf --help >/dev/null

      - name: Unit test stats contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_audit_investor2_yahoo_market_cache.py

      - name: Read back canonical cache and compute empirical stats
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT=/tmp/yahoo-market-cache
          STATS=/tmp/yahoo-market-cache-stats.json
          REMOTE="hf://buckets/$HF_BUCKET/$CACHE_PREFIX"
          mkdir -p "$CACHE_ROOT"
          hf buckets sync "$REMOTE" "$CACHE_ROOT"
          python scripts/audit_investor2_yahoo_market_cache.py \
            --root "$CACHE_ROOT" \
            --expected-manifest-sha256 "$CANONICAL_MANIFEST_SHA256" \
            --output "$STATS" \
            | tee /tmp/yahoo-market-cache-stats.log
          echo "YAHOO_MARKET_CACHE_STATS_SHA256=$(sha256sum "$STATS" | awk '{print $1}')"

      - name: Persist stats outside immutable cache and verify readback
        shell: bash
        run: |
          set -euo pipefail
          STATS=/tmp/yahoo-market-cache-stats.json
          READBACK=/tmp/yahoo-market-cache-stats-readback.json
          STATS_SHA=$(sha256sum "$STATS" | awk '{print $1}')
          REMOTE="hf://buckets/$HF_BUCKET/$EVIDENCE_PREFIX/$CANONICAL_MANIFEST_SHA256/cache_stats.json"
          hf buckets cp "$STATS" "$REMOTE"
          hf buckets cp "$REMOTE" "$READBACK"
          READBACK_SHA=$(sha256sum "$READBACK" | awk '{print $1}')
          test "$STATS_SHA" = "$READBACK_SHA"
          echo "YAHOO_MARKET_CACHE_STATS_RESULT=VERIFIED"
          echo "YAHOO_MARKET_CACHE_STATS_SHA256=$STATS_SHA"
          echo "YAHOO_MARKET_CACHE_STATS_REMOTE=$EVIDENCE_PREFIX/$CANONICAL_MANIFEST_SHA256/cache_stats.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yahoo-market-cache-stats
          path: /tmp/yahoo-market-cache-stats.json
          if-no-files-found: error
