name: Reusable residue-free merged branch GC

on:
  workflow_call:
    inputs:
      apply:
        description: "Delete proven-safe branches instead of dry-run only"
        required: true
        type: boolean

jobs:
  branch-gc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out pinned GC control implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: KAFKA2306/semiconductor-earnings-model
          ref: ec21b7c3ccaef3ca95560b003df1c67635323a9a
          path: .gc-control
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Compile pinned GC implementation
        run: python -m py_compile .gc-control/scripts/cleanup_merged_branches.py

      - name: Verify branch selection safety tests
        if: ${{ !inputs.apply }}
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q .gc-control/tests/test_cleanup_merged_branches.py

      - name: Dry-run deletion proof
        if: ${{ !inputs.apply }}
        run: python .gc-control/scripts/cleanup_merged_branches.py --repo "$GITHUB_REPOSITORY"

      - name: Delete only proven-merged/default-contained ephemeral branches
        if: ${{ inputs.apply }}
        run: python .gc-control/scripts/cleanup_merged_branches.py --repo "$GITHUB_REPOSITORY" --apply
