name: Canonical infrastructure ledger

on:
  schedule:
    - cron: "15 21 * * *"
  pull_request:
    paths:
      - "semicon/**"
      - "data/registry/**"
      - "data/canonical/**"
      - "data/derived/**"
      - "data/raw/google_sheets_import/**"
      - "data/raw/company_ir/**"
      - "data/conflicts/**"
      - "analytics/dbt/**"
      - "tests/test_semicon_canonical_ledger.py"
      - "docs/semiconductor-infrastructure-ledger.md"
      - ".github/workflows/canonical-ledger.yml"
  push:
    branches: [main]
    paths:
      - "semicon/**"
      - "data/registry/**"
      - "data/canonical/**"
      - "data/derived/**"
      - "data/raw/google_sheets_import/**"
      - "data/conflicts/**"
      - "analytics/dbt/**"
      - "tests/test_semicon_canonical_ledger.py"
      - ".github/workflows/canonical-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-ledger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CAPEX_SPREADSHEET_ID: 1lClRXXTUW8-yJtC_PxwvzQ03llC08nW6ovMzQMk5XDQ
      GOOGLE_OAUTH_ACCESS_TOKEN: ${{ secrets.GOOGLE_OAUTH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic environment
        run: uv sync --frozen
      - name: Ingest source before validation
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            uv run python -m semicon.ingest.google_sheets --spreadsheet-id "$CAPEX_SPREADSHEET_ID"
          else
            source_xlsx="data/raw/google_sheets_import/1lClRXXTUW8-yJtC_PxwvzQ03llC08nW6ovMzQMk5XDQ/a5ab21206c397dcf7d7603bb32c0a8e7cd6636d2b4efedbe3d88ff5c8a79a8dd/source.xlsx"
            uv run python -m semicon.ingest.google_sheets --spreadsheet-id "$CAPEX_SPREADSHEET_ID" --xlsx "$source_xlsx"
          fi
          uv run python -m semicon.ingest.primary_project_seeds
          uv run python -m semicon.build_derived
      - name: Test canonical ingest invariants
        run: uv run python -m pytest -q tests/test_semicon_canonical_ledger.py
      - name: Validate schema, provenance, duplicates and NULL policy
        run: uv run python -m semicon.validate_canonical
      - name: Validate canonical to Sheets to canonical round-trip
        run: uv run python -m semicon.round_trip
      - name: Validate original Sheet semantics after regeneration
        run: uv run python -m semicon.source_round_trip
      - name: Build API v2 projection
        run: uv run python -m semicon.build_api_v2
      - name: Build machine-readable hash and freshness status
        run: uv run python -m semicon.audit_snapshot
      - name: Build canonical semantic diff
        run: uv run python -m semicon.semantic_diff
      - name: Gate Canonical to Derived/Mart with dbt
        working-directory: analytics/dbt
        run: uv run --with "dbt-duckdb==1.11.0" dbt build --profiles-dir .
      - name: Generate dbt lineage metadata
        working-directory: analytics/dbt
        run: uv run --with "dbt-duckdb==1.11.0" dbt docs generate --profiles-dir .
      - name: Preserve scheduled-run audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-ledger-audit-${{ github.run_id }}
          path: |
            data/raw/google_sheets_import/${{ env.CAPEX_SPREADSHEET_ID }}/
            data/canonical/
            data/derived/
            data/conflicts/
            data/audit/canonical-ledger-status.json
            data/audit/canonical-semantic-diff.json
            analytics/dbt/target/manifest.json
            analytics/dbt/target/catalog.json
            analytics/dbt/target/run_results.json
          if-no-files-found: error
          retention-days: 30
