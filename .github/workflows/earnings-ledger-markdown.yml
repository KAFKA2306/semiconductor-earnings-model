name: Audited earnings Markdown

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/earnings-ledger-markdown.yml"
      - "scripts/build_earnings_ledger_markdown.py"
      - "tests/test_earnings_ledger_markdown.py"
      - "data/earnings_ledger/publication_latest.json"
      - "data/earnings_ledger/audit_latest.json"
  pull_request:
    paths:
      - ".github/workflows/earnings-ledger-markdown.yml"
      - "scripts/build_earnings_ledger_markdown.py"
      - "tests/test_earnings_ledger_markdown.py"
      - "data/earnings_ledger/publication_latest.json"
      - "data/earnings_ledger/audit_latest.json"

permissions:
  contents: write

concurrency:
  group: earnings-ledger-markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audited-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run Markdown publication regression tests
        run: python -m pytest -q tests/test_earnings_ledger_markdown.py

      - name: Build Markdown from audited publication artifact
        run: python scripts/build_earnings_ledger_markdown.py

      - name: Commit audited Markdown artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/publication_latest.md)" ]; then
            echo "No audited Markdown changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earnings_ledger/publication_latest.md
          git commit -m "data: update audited earnings Markdown"
          bash scripts/push_earnings_commit_with_retry.sh
