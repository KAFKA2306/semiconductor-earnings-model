name: Validate semiconductor BI workbench

on:
  pull_request:
    paths:
      - "data/benchmark/**"
      - "data/ontology/**"
      - "data/financial_db/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/design-check.yml"
      - ".github/workflows/nand-kpi-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic Python environment
        run: uv sync --frozen
      - name: Verify README exposes the live GitHub Pages URL
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/check_readme_pages_link.py
      - name: Fetch primary SEC facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_primary_api.py
      - name: Fetch direct quarterly semiconductor facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_semiconductor_profit_api.py
      - name: Fetch normalized demand-side facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_demand_api.py
      - name: Fetch annual resilience facts
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: uv run python scripts/build_semiconductor_resilience_api_v2.py
      - name: Build ontology-backed research API
        run: uv run python scripts/build_semiconductor_research_api.py
      - name: Finalize self-funding evaluation rules
        run: uv run python scripts/finalize_semiconductor_research_api.py
      - name: Build Financial Database v3 with NAND operating KPIs
        run: uv run python scripts/build_financial_database_with_nand.py
      - name: Build canonical AI infrastructure projection
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          test -n "${SEC_USER_AGENT:-}"
          uv run python scripts/collect_ai_infrastructure_sec.py
          uv run python scripts/build_ai_infrastructure_view.py
          rm -rf site/public/api/v1/ai-infrastructure
          mkdir -p site/public/api/v1
          cp -R api/v1/ai-infrastructure site/public/api/v1/ai-infrastructure
          uv run python - <<'PY'
          import json
          from pathlib import Path
          view=json.loads(Path('site/public/api/v1/ai-infrastructure/index.json').read_text())
          assert view['schema_version'] == 'ai-infrastructure-view.v2'
          assert not [r for r in view['observations'] if r.get('concept_id') == 'capital_expenditures' and r.get('source_tier') == 'primary_regulatory']
          assert all(r['concept_id'] == 'cash_paid_for_property_plant_equipment' for r in view['observations'] if r.get('sec_concept') == 'PaymentsToAcquirePropertyPlantAndEquipment')
          PY
      - name: Test integrated facts, metrics, evaluations, and peers
        run: uv run python -m pytest tests/test_semiconductor_research_api.py::test_research_api_integrates_facts_metrics_evaluations_and_peers -q
      - name: Test normalized research database traceability
        run: uv run python -m pytest tests/test_semiconductor_research_api.py::test_normalized_database_is_traceable_and_has_unique_ids -q
      - name: Test ontology and benchmark coverage
        run: uv run python -m pytest tests/test_semiconductor_research_api.py::test_ontology_and_benchmark_expose_current_and_missing_capabilities -q
      - name: Test deterministic math boundaries
        run: uv run python -m pytest tests/test_semiconductor_research_api.py::test_math_helpers_and_rule_boundaries_are_deterministic -q
      - name: Test NAND KPI parsing, comparison, JSON, and SQLite contracts
        run: uv run python -m pytest tests/test_nand_kpi_pipeline.py -q
      - name: Test financial database JSON and SQLite contracts
        run: uv run python -m pytest tests/test_financial_database.py -q
      - name: Run legacy data contract tests
        run: uv run python -m pytest -q --ignore=tests/test_semiconductor_research_api.py --ignore=tests/test_financial_database.py --ignore=tests/test_nand_kpi_pipeline.py --ignore=tests/test_audit_investor2_yahoo_market_cache.py
      - name: Verify research, NAND, and financial database counts
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          research = json.loads(Path('site/public/api/v2/semiconductor-research/index.json').read_text(encoding='utf-8'))
          financial = json.loads(Path('site/public/api/v3/financial-database/index.json').read_text(encoding='utf-8'))
          assert research['schema_version'] == 'semiconductor-research-workbench.v2'
          assert research['summary']['company_count'] >= 12
          assert research['summary']['reported_fact_count'] >= 250
          assert research['summary']['evaluation_count'] >= 72
          assert research['summary']['evidence_edge_count'] >= 100
          assert financial['schema_version'] == 'financial-database.v3'
          assert 'nand-operating-kpis.v1' in financial['extensions']
          assert financial['audit']['status'] == 'PASS'
          assert financial['audit']['counts']['entities'] == len(financial['entities'])
          assert financial['audit']['counts']['observations'] == len(financial['observations'])
          assert financial['audit']['counts']['nand_actual_observations'] >= 8
          assert financial['audit']['counts']['nand_derived_observations'] >= 2
          assert len(financial['views']['nand_kpi_comparisons']) >= 4
          db = sqlite3.connect('site/public/api/v3/financial-database/financial.db')
          assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert db.execute('SELECT COUNT(*) FROM observations').fetchone()[0] == len(financial['observations'])
          assert db.execute("SELECT COUNT(*) FROM observations WHERE concept_id LIKE 'nand_%'").fetchone()[0] >= 10
          db.close()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build Astro from generated research data
        working-directory: site
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: |
          npm ci
          npm run build
      - name: Verify ledger page live publication boundary
        run: uv run python scripts/check_ledger_page_publication_boundary.py
      - name: Verify BI workbench and legacy-route retirement
        run: |
          set -euo pipefail
          test -s site/dist/assets/bi-workbench.css
          test -s site/dist/assets/bi-workbench.js
          test -s site/dist/api/v1/ai-infrastructure/index.json
          test -s site/dist/api/v3/financial-database/index.json
          test -s site/dist/api/v3/financial-database/financial.db
          for page in \
            site/dist/index.html \
            site/dist/companies/index.html \
            site/dist/financials/index.html \
            site/dist/capacity/index.html \
            site/dist/facilities/index.html \
            site/dist/activity/index.html \
            site/dist/evidence/index.html \
            site/dist/quality/index.html \
            site/dist/earnings/index.html \
            site/dist/model/index.html \
            site/dist/resilience/index.html; do
            test -s "$page"
            grep -Fq 'data-workbench' "$page"
            grep -Fq 'RESEARCH WORKBENCH' "$page"
            ! grep -Fq 'pastel-watercolor.css' "$page"
            ! grep -Fq 'research-context.js' "$page"
            ! grep -Fq 'research-context.css' "$page"
          done
          grep -Fq 'data-view="financials"' site/dist/earnings/index.html
          grep -Fq 'data-view="projects"' site/dist/model/index.html
          grep -Fq 'data-view="quality"' site/dist/resilience/index.html
          grep -Fq 'data-open-columns' site/dist/index.html
          grep -Fq 'data-open-compare' site/dist/index.html
          grep -Fq 'data-open-views' site/dist/index.html
          grep -Fq 'data-command' site/dist/index.html
          grep -Fq 'data-inspector' site/dist/index.html
          grep -Fq 'data-compare-bar' site/dist/index.html
          for page in site/dist/china-ai/index.html site/dist/investment-policy/index.html site/dist/ledger/index.html; do
            test -s "$page"
            grep -Fq 'data-aux-workbench' "$page"
            grep -Fq 'assets/aux-workbench.css' "$page"
            ! grep -Fq 'pastel-watercolor.css' "$page"
          done

      - name: Capture responsive visual evidence
        working-directory: site
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 install chromium
          npm run preview -- --host 127.0.0.1 --port 4321 >/tmp/workbench-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4321/semiconductor-earnings-model/" >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p visual-evidence
          row_id="$(jq -r '.projects[0].project_id' dist/api/v2/projects/index.json)"
          encoded_row="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$row_id")"
          url="http://127.0.0.1:4321/semiconductor-earnings-model/?row=$encoded_row"
          npx --yes playwright@1.55.0 screenshot --viewport-size="1440,900" --wait-for-timeout=900 "$url" visual-evidence/workbench-1440x900.png
          npx --yes playwright@1.55.0 screenshot --viewport-size="1366,768" --wait-for-timeout=900 "$url" visual-evidence/workbench-1366x768.png
          npx --yes playwright@1.55.0 screenshot --viewport-size="390,844" --wait-for-timeout=900 "http://127.0.0.1:4321/semiconductor-earnings-model/" visual-evidence/workbench-390x844-grid.png
          npx --yes playwright@1.55.0 screenshot --viewport-size="390,844" --wait-for-timeout=900 "$url" visual-evidence/workbench-390x844-inspector.png
          test -s visual-evidence/workbench-1440x900.png
          test -s visual-evidence/workbench-1366x768.png
          test -s visual-evidence/workbench-390x844-grid.png
          test -s visual-evidence/workbench-390x844-inspector.png

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbench-visual-evidence-${{ github.sha }}
          path: site/visual-evidence
          if-no-files-found: error
