name: Verified revenue growth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-revenue-growth.yml'
      - 'scripts/derive_verified_revenue_growth.py'
      - 'scripts/audit_verified_revenue_growth_duration.py'
      - 'tests/test_verified_revenue_growth.py'
      - 'tests/test_verified_revenue_growth_duration_audit.py'
      - 'data/earnings_ledger/verified_revenue_latest.json'
      - 'data/earnings_ledger/verified_revenue_lineage_audit_latest.json'
  pull_request:
    paths:
      - '.github/workflows/verified-revenue-growth.yml'
      - 'scripts/derive_verified_revenue_growth.py'
      - 'scripts/audit_verified_revenue_growth_duration.py'
      - 'tests/test_verified_revenue_growth.py'
      - 'tests/test_verified_revenue_growth_duration_audit.py'
      - 'data/earnings_ledger/verified_revenue_latest.json'
      - 'data/earnings_ledger/verified_revenue_lineage_audit_latest.json'

permissions:
  contents: write

concurrency:
  group: verified-revenue-growth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derive-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_verified_revenue_growth.py tests/test_verified_revenue_growth_duration_audit.py
      - name: Derive verified YoY with retry
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        shell: bash
        run: |
          set -u
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo "Repository variable SEC_USER_AGENT is required."
            exit 1
          fi
          ok=0
          for attempt in 1 2 3; do
            echo "Verified revenue growth attempt ${attempt}/3"
            if python scripts/derive_verified_revenue_growth.py; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "verified revenue growth derivation failed after 3 attempts"
            exit 1
          fi
      - name: Audit YoY duration and provenance contract
        run: python scripts/audit_verified_revenue_growth_duration.py
      - name: Persist verified growth artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/earnings_ledger/verified_revenue_growth_latest.json data/earnings_ledger/verified_revenue_growth_duration_audit_latest.json)" ]; then
            echo "No verified growth changes."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/earnings_ledger/verified_revenue_growth_latest.json data/earnings_ledger/verified_revenue_growth_duration_audit_latest.json
          git commit -m "data: update verified revenue growth"
          git push
