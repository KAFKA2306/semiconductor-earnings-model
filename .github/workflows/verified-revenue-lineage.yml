name: Verified revenue lineage audit

on:
  pull_request:
    paths:
      - 'scripts/audit_earnings_evidence.py'
      - 'scripts/audit_verified_revenue_lineage.py'
      - 'tests/test_earnings_evidence_audit.py'
      - 'tests/test_verified_revenue_lineage.py'
      - 'data/earnings_ledger/**'
      - '.github/workflows/verified-revenue-lineage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_earnings_evidence.py'
      - 'scripts/audit_verified_revenue_lineage.py'
      - 'tests/test_earnings_evidence_audit.py'
      - 'tests/test_verified_revenue_lineage.py'
      - 'data/earnings_ledger/**'
      - '.github/workflows/verified-revenue-lineage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Regression tests
        run: python -m pytest -q tests/test_earnings_evidence_audit.py tests/test_verified_revenue_lineage.py
      - name: Refresh required primary evidence
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "${SEC_USER_AGENT:-}" ]; then
            echo "Repository variable SEC_USER_AGENT is required." >&2
            exit 1
          fi
          python scripts/audit_earnings_evidence.py
      - name: Audit verified revenue lineage
        run: python scripts/audit_verified_revenue_lineage.py
      - name: Persist audit artifact on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain -- data/earnings_ledger/verified_revenue_lineage_audit_latest.json)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/earnings_ledger/verified_revenue_lineage_audit_latest.json
            git commit -m "data: update verified revenue lineage audit"
            git push
          fi
