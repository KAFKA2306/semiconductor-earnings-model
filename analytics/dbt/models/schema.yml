version: 2

models:
  - name: silver_events
    description: Canonical event ledger exposed to dbt as the Silver contract.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: quality_flag
        data_tests: [not_null]

  - name: silver_capex_projects
    description: Canonical CapEx/project ledger exposed to dbt as the Silver contract.
    columns:
      - name: project_id
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: quality_flag
        data_tests: [not_null]

  - name: silver_facilities
    description: Canonical facility ledger exposed to dbt as the Silver contract.
    columns:
      - name: facility_id
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]

  - name: silver_customer_commitments
    description: Canonical customer commitments exposed to dbt as the Silver contract.
    columns:
      - name: commitment_id
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]

  - name: gold_capex_projects
    description: Publication-safe CapEx projects. Only primary-source-extracted rows with source identity are promoted.
    columns:
      - name: project_id
        data_tests: [not_null, unique]
      - name: entity_id
        data_tests: [not_null]
      - name: source_doc_id
        data_tests: [not_null]
      - name: source_url
        data_tests: [not_null]
      - name: quality_flag
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["primary_source_extracted"]

  - name: gold_capex_company_coverage
    description: Data-coverage mart derived only from publication-safe CapEx projects.
    columns:
      - name: entity_id
        data_tests: [not_null, unique]
      - name: project_count
        data_tests: [not_null]
      - name: source_document_count
        data_tests: [not_null]
